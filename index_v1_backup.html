<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Al Fatih — Belajar, Bintang &amp; Rutinitas</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;
    background:radial-gradient(circle at 15% 0%,#155e52 0%,#0b2545 55%,#071528 100%);
    background-attachment:fixed;
    color:#f8fafc;overflow-x:hidden;
  }
  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
    padding:10px 12px;background:rgba(7,21,40,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.10);
  }
  header h1{font-size:19px;margin:0;flex:1;text-align:center;font-weight:800;letter-spacing:.3px}
  .ico-btn{
    width:46px;height:46px;flex:0 0 46px;border:none;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.12);color:#fff;font-size:22px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .ico-btn:active{transform:scale(.93)}
  main{padding:14px 14px 40px;max-width:820px;margin:0 auto}
  /* ---------- home ---------- */
  .hello{
    background:linear-gradient(135deg,#f59e0b,#f97316);
    border-radius:24px;padding:18px 18px 20px;margin-bottom:16px;
    box-shadow:0 10px 30px rgba(249,115,22,.30);color:#3b1d00;
  }
  .hello .nm{font-size:clamp(26px,7vw,38px);font-weight:900;line-height:1.1;margin:2px 0 6px}
  .hello .sub{font-size:15px;font-weight:700;opacity:.85}
  .hello .say{margin-top:12px;background:rgba(255,255,255,.55);border:none;border-radius:14px;
    padding:10px 16px;font-size:16px;font-weight:800;color:#3b1d00;cursor:pointer}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .tile{
    border:none;border-radius:22px;padding:20px 12px;cursor:pointer;color:#08172e;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    min-height:130px;box-shadow:0 8px 22px rgba(0,0,0,.28);font-family:inherit;
  }
  .tile:active{transform:scale(.96)}
  .tile .em{font-size:46px;line-height:1}
  .tile .lb{font-size:18px;font-weight:900}
  .t1{background:linear-gradient(150deg,#fca5a5,#f87171)}
  .t2{background:linear-gradient(150deg,#93c5fd,#3b82f6)}
  .t3{background:linear-gradient(150deg,#86efac,#22c55e)}
  .t4{background:linear-gradient(150deg,#fde68a,#fbbf24)}
  .t5{background:linear-gradient(150deg,#c4b5fd,#8b5cf6)}
  .t6{background:linear-gradient(150deg,#f9a8d4,#ec4899)}
  /* ---------- grids ---------- */
  .grid-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
  .lbtn{
    aspect-ratio:1/1;border:none;border-radius:18px;cursor:pointer;font-family:inherit;
    font-size:clamp(26px,6.5vw,40px);font-weight:900;color:#08172e;
    display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.25);
  }
  .lbtn:active{transform:scale(.93)}
  .c1{background:#a7f3d0}.c2{background:#bfdbfe}.c3{background:#fde68a}
  .c4{background:#fecaca}.c5{background:#ddd6fe}.c6{background:#fbcfe8}
  .hbtn{background:#e2e8f0;font-size:clamp(30px,8vw,46px)}
  .prog-note{font-size:14px;opacity:.75;margin:0 0 12px}
  /* ---------- routine ---------- */
  .routine{display:flex;flex-direction:column;gap:12px}
  .rrow{
    display:flex;align-items:center;gap:14px;border:2px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.07);border-radius:20px;padding:14px 16px;cursor:pointer;
    font-family:inherit;color:#fff;text-align:left;width:100%;
  }
  .rrow:active{transform:scale(.985)}
  .rrow .ri{font-size:36px;line-height:1;width:46px;text-align:center}
  .rrow .rl{font-size:19px;font-weight:800;flex:1}
  .rrow .rc{width:40px;height:40px;flex:0 0 40px;border-radius:50%;
    border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:20px}
  .rrow.done{background:linear-gradient(120deg,rgba(34,197,94,.28),rgba(34,197,94,.12));border-color:#22c55e}
  .rrow.done .rc{background:#22c55e;border-style:solid;border-color:#22c55e}
  .rrow.done .rl{text-decoration:line-through;opacity:.8}
  .bar{height:16px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin:14px 0 6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);width:0;transition:width .4s}
  /* ---------- stars ---------- */
  .starwrap{text-align:center;padding:8px 0 4px}
  .bigstar{font-size:78px;line-height:1;filter:drop-shadow(0 8px 18px rgba(250,204,21,.5))}
  .starcount{font-size:clamp(46px,13vw,68px);font-weight:900;margin:6px 0 0;color:#fde047}
  .starwrap p{margin:6px 0 0;opacity:.85;font-size:15px}
  .btn{
    display:block;width:100%;border:none;border-radius:18px;padding:18px;font-size:19px;
    font-weight:900;font-family:inherit;cursor:pointer;margin-top:16px;
    background:linear-gradient(135deg,#facc15,#f59e0b);color:#3b1d00;
  }
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
  .btn.sm{padding:12px;font-size:16px;border-radius:14px;margin-top:8px}
  /* ---------- rewards ---------- */
  .rewlist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .rew{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:16px;padding:14px 16px;font-size:17px;font-weight:700}
  /* ---------- overlay card ---------- */
  #overlay{
    position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(4,12,24,.94);padding:20px;
  }
  #overlay.on{display:flex}
  .card{width:100%;max-width:520px;text-align:center;border-radius:28px;padding:26px 20px 22px;position:relative}
  .card .huge{font-size:clamp(90px,34vw,190px);font-weight:900;line-height:.95}
  .card .arab{font-size:clamp(100px,36vw,200px);line-height:1.1}
  .card .word{font-size:clamp(26px,8vw,40px);font-weight:900;margin-top:6px}
  .card .em{font-size:clamp(50px,16vw,80px);line-height:1.2;margin-top:6px}
  .card .cnt{font-size:clamp(22px,6vw,32px);line-height:1.4;margin-top:10px;word-break:break-word}
  .card .tip{font-size:15px;font-weight:700;opacity:.7;margin-top:14px}
  .card .close{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;
    border:none;background:rgba(0,0,0,.18);color:#08172e;font-size:22px;cursor:pointer}
  .navrow{display:flex;gap:12px;justify-content:center;margin-top:18px}
  .navrow button{border:none;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:800;
    background:rgba(0,0,0,.18);color:#08172e;cursor:pointer;font-family:inherit}
  /* ---------- modal / parent ---------- */
  #modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(4,12,24,.9);padding:18px}
  #modal.on{display:flex}
  .sheet{background:#0f2136;border:1px solid rgba(255,255,255,.14);border-radius:22px;
    padding:20px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
  .sheet h2{margin:0 0 6px;font-size:20px}
  .sheet p.hint{margin:0 0 14px;font-size:14px;opacity:.75}
  .field{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .field input[type=text],.field input[type=number]{
    flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    border-radius:12px;padding:12px;color:#fff;font-size:16px;font-family:inherit}
  .field button{border:none;border-radius:12px;padding:12px 14px;background:#ef4444;color:#fff;
    font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
  .rowline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.09)}
  .rowline span.em{font-size:24px}
  .rowline span.tx{flex:1;font-size:16px;font-weight:700}
  .rowline button{border:none;border-radius:10px;padding:8px 12px;background:rgba(255,255,255,.14);
    color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#111827;border:1px solid rgba(255,255,255,.2);color:#fff;padding:12px 20px;
    border-radius:99px;font-weight:800;opacity:0;transition:.3s;z-index:90;pointer-events:none;font-size:15px}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* flying star + confetti */
  .fly{position:fixed;z-index:70;font-size:40px;pointer-events:none;transition:all .9s cubic-bezier(.2,.8,.2,1)}
  .conf{position:fixed;top:-40px;z-index:70;font-size:30px;pointer-events:none;animation:fall 1.9s linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.15}}
  footer{text-align:center;font-size:12.5px;opacity:.45;padding:6px 0 26px}
</style>
</head>
<body>
<header>
  <button class="ico-btn" id="btnBack" title="Kembali">←</button>
  <h1 id="ttl">Al Fatih</h1>
  <button class="ico-btn" id="btnHome" title="Beranda">🏠</button>
</header>
<main id="view"></main>
<footer>Dibuat untuk Al Fatih • <span id="footnote">buka di HP atau laptop, tanpa internet</span></footer>

<div id="overlay"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Al Fatih — aplikasi belajar & rutinitas harian
   Semua data disimpan di perangkat (localStorage). Tanpa internet.
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---------- penyimpanan ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---------- data bawaan ---------- */
const DEF_ROUTINES = [
  { id: 'r1',  em: '🌞', tx: 'Bangun pagi' },
  { id: 'r2',  em: '🤗', tx: 'Peluk Ayah & Ibu' },
  { id: 'r3',  em: '🪥', tx: 'Sikat gigi' },
  { id: 'r4',  em: '🚿', tx: 'Mandi' },
  { id: 'r5',  em: '🍳', tx: 'Sarapan' },
  { id: 'r6',  em: '📖', tx: 'Ngaji & belajar' },
  { id: 'r7',  em: '🍛', tx: 'Makan siang' },
  { id: 'r8',  em: '😴', tx: 'Tidur siang' },
  { id: 'r9',  em: '🧸', tx: 'Main & rapikan mainan' },
  { id: 'r10', em: '🍽️', tx: 'Makan malam' },
  { id: 'r11', em: '🪥', tx: 'Sikat gigi malam' },
  { id: 'r12', em: '🌙', tx: 'Tidur malam' }
];
const DEF_REWARDS = [
  'Pelukan hangat 🤗', 'Ciuman sayang 😘', 'Peluk + gelitik 🤣',
  'Jalan-jalan sore 🛴', 'Baca buku bersama 📚', 'Es krim kecil 🍦',
  'Main di taman 🛝', 'Nonton kartun 15 menit 📺', 'Naik motor keliling 🏍️'
];

const LETTERS = [
  ['A','Apel','🍎'],['B','Bola','⚽'],['C','Cicak','🦎'],['D','Domba','🐑'],
  ['E','Ember','🪣'],['F','Foto','📷'],['G','Gajah','🐘'],['H','Harimau','🐯'],
  ['I','Ikan','🐟'],['J','Jeruk','🍊'],['K','Kucing','🐱'],['L','Lampu','💡'],
  ['M','Mata','👁️'],['N','Nanas','🍍'],['O','Obat','💊'],['P','Pisang','🍌'],
  ['Q','Quran','📖'],['R','Rumah','🏠'],['S','Sepatu','👟'],['T','Topi','🧢'],
  ['U','Ular','🐍'],['V','Vas','🏺'],['W','Wortel','🥕'],['X','Xilofon','🎹'],
  ['Y','Yoyo','🪀'],['Z','Zebra','🦓']
];
const HIJAIYAH = [
  ['ا','Alif','a'],['ب','Ba','ba'],['ت','Ta','ta'],['ث','Tsa','tsa'],
  ['ج','Jim','ja'],['ح','Ha','ha'],['خ','Kha','kha'],['د','Dal','da'],
  ['ذ','Dzal','dza'],['ر','Ra','ra'],['ز','Zai','za'],['س','Sin','sa'],
  ['ش','Syin','sya'],['ص','Shad','sha'],['ض','Dhad','dha'],['ط','Tha','tha'],
  ['ظ','Zha','zha'],['ع',"'Ain","'a"],['غ','Ghain','gha'],['ف','Fa','fa'],
  ['ق','Qaf','qa'],['ك','Kaf','ka'],['ل','Lam','la'],['م','Mim','ma'],
  ['ن','Nun','na'],['و','Wau','wa'],['ه','Ha','ha'],['ي','Ya','ya']
];
const COUNT_EMOJI = ['🍎','⚽','🐟','⭐','🧸','🌸','🍌','🐥','🎈','🍓'];

/* ---------- state ---------- */
const S = {
  name:    () => LS.get('af_name', 'Al Fatih'),
  routines:() => LS.get('af_routines', DEF_ROUTINES),
  rewards: () => LS.get('af_rewards', DEF_REWARDS),
  target:  () => LS.get('af_target', 10),
  stars:   () => LS.get('af_stars', 0),
  today:   () => { const t = LS.get('af_today', { d: '', done: [] }); return t.d === todayKey() ? t : { d: todayKey(), done: [] }; },
  saveToday(t){ LS.set('af_today', t); },
  history: () => LS.get('af_history', []),
  logStar(n){ const h = S.history(); const t = todayKey();
    const e = h.find(x => x.d === t) || (h.push({ d: t, n: 0, done: 0 }), h[h.length - 1]);
    e.n += n; LS.set('af_history', h); }
};

/* ---------- suara ---------- */
let AC = null;
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function tone(f, delay, dur, gain, type){
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain || 0.14, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.18));
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + (dur || 0.18) + 0.05);
}
function chime(){ tone(784, 0, .16); tone(1046, .11, .18); tone(1568, .22, .3); }
function pop(){ tone(520, 0, .09, .1, 'triangle'); }
function fanfare(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f, i*.11, .3, .16)); }

/* ---------- suara manusia ---------- */
let VOICES = [];
function loadVoices(){ try { VOICES = window.speechSynthesis.getVoices() || []; } catch (e) { VOICES = []; } }
if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 400); }
function pickVoice(prefix){
  const list = VOICES.length ? VOICES : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
  return list.find(v => (v.lang || '').toLowerCase().replace('_','-').startsWith(prefix))
      || list.find(v => (v.lang || '').toLowerCase().startsWith(prefix.slice(0,2)))
      || null;
}
function speak(text, lang, rate){
  if (!window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'id-ID';
    const v = pickVoice(u.lang);
    if (v) u.voice = v;
    u.rate = rate || 0.85; u.pitch = 1.15; u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
/* hijaiyah: coba baca huruf arab, kalau tak ada suara arab sebut namanya */
function speakHijaiyah(ar, nama){
  if (!window.speechSynthesis) return;
  const arVoice = pickVoice('ar');
  if (arVoice) speak(ar, 'ar-SA', 0.7); else speak(nama, 'id-ID', 0.8);
}

/* ---------- efek visual ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1900); }
function flyStar(fromEl){
  try {
    const r = fromEl ? fromEl.getBoundingClientRect() : { left: innerWidth/2, top: innerHeight/2, width:0, height:0 };
    const s = document.createElement('div');
    s.className = 'fly'; s.textContent = '⭐';
    s.style.left = (r.left + r.width/2) + 'px'; s.style.top = (r.top + r.height/2) + 'px';
    document.body.appendChild(s);
    requestAnimationFrame(()=>{ s.style.transform = 'translate(-50%,-50%) scale(1.4)'; });
    setTimeout(()=>{ s.style.left = (innerWidth/2)+'px'; s.style.top = '70px'; s.style.transform = 'translate(-50%,-50%) scale(.3)'; s.style.opacity = '.2'; }, 30);
    setTimeout(()=>s.remove(), 1000);
  } catch (e) {}
}
function confetti(){
  const em = ['⭐','🎉','✨','🌟','🎈','💚','🤗'];
  for (let i = 0; i < 26; i++) {
    const d = document.createElement('div');
    d.className = 'conf'; d.textContent = em[i % em.length];
    d.style.left = (Math.random()*94 + 2) + 'vw';
    d.style.animationDelay = (Math.random()*0.6) + 's';
    d.style.fontSize = (22 + Math.random()*22) + 'px';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 2800);
  }
}

/* ---------- kerangka tampilan ---------- */
let stack = [];
function setTitle(t){ $('#ttl').textContent = t; }
function render(name, push){
  if (push !== false) { if (stack[stack.length-1] !== name) stack.push(name); }
  const v = $('#view');
  v.innerHTML = '';
  VIEWS[name](v);
  window.scrollTo(0, 0);
}
function goHome(){ stack = []; render('home', true); }
$('#btnHome').onclick = goHome;
$('#btnBack').onclick = () => {
  if ($('#overlay').classList.contains('on')) { closeOverlay(); return; }
  if ($('#modal').classList.contains('on')) { closeModal(); return; }
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (stack.length > 1) { stack.pop(); const prev = stack[stack.length-1]; stack.pop(); render(prev, true); }
  else goHome();
};

/* ---------- overlay kartu besar ---------- */
function openOverlay(html, bg){ const o = $('#overlay'); o.innerHTML = ''; const c = document.createElement('div');
  c.className = 'card'; c.style.background = bg || 'linear-gradient(150deg,#fde68a,#fbbf24)'; c.style.color = '#08172e';
  c.innerHTML = html; o.appendChild(c); o.classList.add('on'); return c; }
function closeOverlay(){ $('#overlay').classList.remove('on'); $('#overlay').innerHTML = ''; if (window.speechSynthesis) window.speechSynthesis.cancel(); }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeOverlay(); });
function closeModal(){ $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ============================================================
   TAMPILAN
   ============================================================ */
const VIEWS = {};

VIEWS.home = (v) => {
  setTitle(S.name());
  const st = S.stars(), tg = S.target();
  const done = S.today().done.length, tot = S.routines().length;
  const jam = new Date().getHours();
  const sapa = jam < 11 ? 'Selamat pagi' : jam < 15 ? 'Selamat siang' : jam < 18 ? 'Selamat sore' : 'Selamat malam';

  const hello = document.createElement('div');
  hello.className = 'hello';
  hello.innerHTML = '<div class="sub">' + sapa + ', sayang 👋</div>' +
    '<div class="nm">' + S.name() + '</div>' +
    '<div class="sub">⭐ ' + st + ' bintang • hari ini ' + done + '/' + tot + ' kegiatan</div>' +
    '<button class="say" id="sayHi">🔊 Dengar sapaan</button>';
  v.appendChild(hello);
  $('#sayHi', hello).onclick = () => { pop(); speak(sapa + ', ' + S.name() + '. Ayo belajar dan kumpulkan bintang!', 'id-ID'); };

  const tiles = [
    ['🔤','Belajar Huruf','t1','huruf'],
    ['🔢','Belajar Angka','t2','angka'],
    ['🕌','Huruf Hijaiyah','t3','hijaiyah'],
    ['✅','Rutinitas Hari Ini','t4','rutin'],
    ['⭐','Papan Bintang','t5','bintang'],
    ['🎁','Daftar Hadiah','t6','hadiah']
  ];
  const g = document.createElement('div'); g.className = 'tiles';
  tiles.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tile ' + t[2];
    b.innerHTML = '<span class="em">' + t[0] + '</span><span class="lb">' + t[1] + '</span>';
    b.onclick = () => { pop(); render(t[3]); };
    g.appendChild(b);
  });
  v.appendChild(g);

  const set = document.createElement('button');
  set.className = 'btn ghost sm';
  set.textContent = '⚙️ Pengaturan Ayah/Ibu';
  set.onclick = parentGate;
  v.appendChild(set);
};

/* ---------- belajar huruf ---------- */
VIEWS.huruf = (v) => {
  setTitle('Belajar Huruf A–Z');
  const p = document.createElement('p'); p.className = 'prog-note';
  p.textContent = 'Sentuh hurufnya — nanti terdengar suaranya. Ada ' + LETTERS.length + ' huruf.';
  v.appendChild(p);
  const g = document.createElement('div'); g.className = 'grid-letters';
  LETTERS.forEach((L, i) => {
    const b = document.createElement('button');
    b.className = 'lbtn c' + (i % 6 + 1);
    b.textContent = L[0];
    b.onclick = () => { pop(); showLetter(i); };
    g.appendChild(b);
  });
  v.appendChild(g);
};
function showLetter(i){
  const L = LETTERS[i];
  const c = openOverlay(
    '<button class="close">✕</button>' +
    '<div class="huge">' + L[0] + L[0].toLowerCase() + '</div>' +
    '<div class="word">' + L[0] + ' untuk ' + L[1] + '</div>' +
    '<div class="em">' + L[2] + '</div>' +
    '<div class="tip">sentuh untuk dengar lagi</div>' +
    '<div class="navrow"><button data-p="-1">←</button><button data-p="1">→</button></div>',
    'linear-gradient(150deg,#bfdbfe,#93c5fd)'
  );
  const sayIt = () => speak(L[0] + '. ' + L[0] + ' untuk ' + L[1], 'id-ID', 0.8);
  c.onclick = (e) => {
    const pv = e.target.getAttribute && e.target.getAttribute('data-p');
    if (pv) { closeOverlay(); showLetter((i + Number(pv) + LETTERS.length) % LETTERS.length); return; }
    if (e.target.classList.contains('close')) { closeOverlay(); return; }
    pop(); sayIt();
  };
  setTimeout(sayIt, 220);
}

/* ---------- belajar angka ---------- */
VIEWS.angka = (v) => {
  setTitle('Belajar Angka 1–20');
  const p = document.createElement('p'); p.className = 'prog-note';
  p.textContent = 'Sentuh angkanya — nanti dihitung bersama.';
  v.appendChild(p);
  const g = document.createElement('div'); g.className = 'grid-letters';
  for (let n = 1; n <= 20; n++) {
    const b = document.createElement('button');
    b.className = 'lbtn c' + (n % 6 + 1);
    b.textContent = n;
    b.onclick = () => { pop(); showNumber(n); };
    g.appendChild(b);
  }
  v.appendChild(g);
};
const ANGKA_KATA = ['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh',
  'sebelas','dua belas','tiga belas','empat belas','lima belas','enam belas','tujuh belas','delapan belas','sembilan belas','dua puluh'];
function showNumber(n){
  const em = COUNT_EMOJI[n % COUNT_EMOJI.length];
  const c = openOverlay(
    '<button class="close">✕</button>' +
    '<div class="huge">' + n + '</div>' +
    '<div class="word">' + ANGKA_KATA[n] + '</div>' +
    '<div class="cnt">' + em.repeat(n) + '</div>' +
    '<div class="tip">sentuh untuk dengar lagi</div>' +
    '<div class="navrow"><button data-p="-1">←</button><button data-p="1">→</button></div>',
    'linear-gradient(150deg,#bbf7d0,#86efac)'
  );
  const sayIt = () => speak(ANGKA_KATA[n], 'id-ID', 0.75);
  c.onclick = (e) => {
    const pv = e.target.getAttribute && e.target.getAttribute('data-p');
    if (pv) { closeOverlay(); showNumber(Math.min(20, Math.max(1, n + Number(pv)))); return; }
    if (e.target.classList.contains('close')) { closeOverlay(); return; }
    pop(); sayIt();
  };
  setTimeout(sayIt, 220);
}

/* ---------- hijaiyah ---------- */
VIEWS.hijaiyah = (v) => {
  setTitle('Huruf Hijaiyah');
  const p = document.createElement('p'); p.className = 'prog-note';
  p.textContent = 'Sentuh hurufnya. Ada ' + HIJAIYAH.length + ' huruf hijaiyah.';
  v.appendChild(p);
  const g = document.createElement('div'); g.className = 'grid-letters';
  HIJAIYAH.forEach((H, i) => {
    const b = document.createElement('button');
    b.className = 'lbtn hbtn';
    b.textContent = H[0];
    b.onclick = () => { pop(); showHijaiyah(i); };
    g.appendChild(b);
  });
  v.appendChild(g);
};
function showHijaiyah(i){
  const H = HIJAIYAH[i];
  const c = openOverlay(
    '<button class="close">✕</button>' +
    '<div class="arab">' + H[0] + '</div>' +
    '<div class="word">' + H[1] + '</div>' +
    '<div class="tip">bunyi: ' + H[2] + ' • sentuh untuk dengar lagi</div>' +
    '<div class="navrow"><button data-p="-1">←</button><button data-p="1">→</button></div>',
    'linear-gradient(150deg,#ddd6fe,#c4b5fd)'
  );
  const sayIt = () => speakHijaiyah(H[0], H[1]);
  c.onclick = (e) => {
    const pv = e.target.getAttribute && e.target.getAttribute('data-p');
    if (pv) { closeOverlay(); showHijaiyah((i + Number(pv) + HIJAIYAH.length) % HIJAIYAH.length); return; }
    if (e.target.classList.contains('close')) { closeOverlay(); return; }
    pop(); sayIt();
  };
  setTimeout(sayIt, 220);
}

/* ---------- rutinitas harian ---------- */
VIEWS.rutin = (v) => {
  setTitle('Rutinitas Hari Ini');
  const rs = S.routines(), t = S.today();
  const p = document.createElement('p'); p.className = 'prog-note';
  p.textContent = 'Sentuh kalau sudah dikerjakan — dapat 1 bintang ⭐ setiap kegiatan.';
  v.appendChild(p);

  const wrap = document.createElement('div'); wrap.className = 'routine';
  rs.forEach(r => {
    const done = t.done.indexOf(r.id) >= 0;
    const b = document.createElement('button');
    b.className = 'rrow' + (done ? ' done' : '');
    b.innerHTML = '<span class="ri">' + r.em + '</span><span class="rl">' + r.tx + '</span><span class="rc">' + (done ? '⭐' : '') + '</span>';
    b.onclick = () => {
      const tt = S.today();
      const idx = tt.done.indexOf(r.id);
      if (idx >= 0) { tt.done.splice(idx, 1); LS.set('af_stars', Math.max(0, S.stars() - 1)); S.logStar(-1); toast('Bintang dikurangi 1'); }
      else {
        tt.done.push(r.id); LS.set('af_stars', S.stars() + 1); S.logStar(1);
        chime(); flyStar(b); toast('Hebat! +1 ⭐');
        speak('Hebat ' + S.name() + '!', 'id-ID', 0.9);
        if (tt.done.length === rs.length) { setTimeout(()=>{ confetti(); fanfare(); speak('Alhamdulillah! Semua kegiatan hari ini selesai!', 'id-ID'); toast('Semua selesai! Alhamdulillah 🎉'); }, 500); }
      }
      S.saveToday(tt);
      const y = window.scrollY; render('rutin', false); window.scrollTo(0, y);
    };
    wrap.appendChild(b);
  });
  v.appendChild(wrap);

  const bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = '<i style="width:' + Math.round(t.done.length / Math.max(1, rs.length) * 100) + '%"></i>';
  v.appendChild(bar);
  const note = document.createElement('p'); note.className = 'prog-note';
  note.textContent = t.done.length + ' dari ' + rs.length + ' kegiatan selesai hari ini.';
  v.appendChild(note);
};

/* ---------- papan bintang & hadiah ---------- */
VIEWS.bintang = (v) => {
  setTitle('Papan Bintang');
  const st = S.stars(), tg = S.target();
  const left = Math.max(0, tg - st);
  const w = document.createElement('div'); w.className = 'starwrap';
  w.innerHTML = '<div class="bigstar">' + (st >= tg ? '🏆' : '⭐') + '</div>' +
    '<div class="starcount">' + st + '</div>' +
    '<p>' + (st >= tg ? 'Bintangnya penuh! Tukar hadiah yuk!' : 'Kumpulkan ' + left + ' bintang lagi untuk hadiah 🎁') + '</p>';
  v.appendChild(w);

  const bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = '<i style="width:' + Math.min(100, Math.round(st / Math.max(1, tg) * 100)) + '%"></i>';
  v.appendChild(bar);
  const n = document.createElement('p'); n.className = 'prog-note';
  n.textContent = 'Target: ' + tg + ' bintang = 1 hadiah';
  v.appendChild(n);

  const btn = document.createElement('button');
  btn.className = 'btn'; btn.textContent = '🎁 Tukar Bintang Sekarang';
  btn.disabled = st < tg;
  btn.onclick = () => {
    const rw = S.rewards();
    const pick = rw[Math.floor(Math.random() * rw.length)];
    LS.set('af_stars', st - tg);
    LS.set('af_lastReward', { d: todayKey(), t: pick });
    confetti(); fanfare();
    openOverlay(
      '<button class="close">✕</button>' +
      '<div class="em">🎁</div>' +
      '<div class="word">Hadiah untuk ' + S.name() + '!</div>' +
      '<div class="huge" style="font-size:clamp(40px,11vw,64px)">' + pick + '</div>' +
      '<div class="tip">bintang berkurang ' + tg + ' ⭐ — ayo kumpulkan lagi!</div>',
      'linear-gradient(150deg,#fbcfe8,#f9a8d4)'
    );
    speak('Hadiah untuk ' + S.name() + '. ' + pick.replace(/[^\w\sÀ-ÿ']/g, ''), 'id-ID');
  };
  v.appendChild(btn);

  const last = LS.get('af_lastReward', null);
  if (last) { const p = document.createElement('p'); p.className = 'prog-note'; p.textContent = 'Hadiah terakhir: ' + last.t; v.appendChild(p); }

  const hb = document.createElement('button');
  hb.className = 'btn ghost sm'; hb.textContent = '📅 Lihat riwayat bintang';
  hb.onclick = () => {
    const h = S.history().slice(-14).reverse();
    openModal('<h2>Riwayat Bintang</h2><p class="hint">14 hari terakhir</p>' +
      (h.length ? h.map(x => '<div class="rowline"><span class="em">⭐</span><span class="tx">' + x.d + '</span><span class="tx" style="flex:0">' + x.n + ' bintang</span></div>').join('')
                : '<p class="prog-note">Belum ada catatan.</p>') +
      '<button class="btn sm" onclick="closeModal()">Tutup</button>');
  };
  v.appendChild(hb);
};

VIEWS.hadiah = (v) => {
  setTitle('Daftar Hadiah');
  const p = document.createElement('p'); p.className = 'prog-note';
  p.textContent = 'Setiap tukar bintang, hadiahnya dipilih acak dari daftar ini — jadi selalu berubah.';
  v.appendChild(p);
  const list = document.createElement('div'); list.className = 'rewlist';
  S.rewards().forEach(r => { const d = document.createElement('div'); d.className = 'rew'; d.textContent = r; list.appendChild(d); });
  v.appendChild(list);
  const b = document.createElement('button');
  b.className = 'btn ghost sm'; b.textContent = '⚙️ Ubah daftar hadiah (Ayah/Ibu)';
  b.onclick = parentGate;
  v.appendChild(b);
};

/* ---------- pengaturan orang tua ---------- */
function parentGate(){
  const a = 6 + Math.floor(Math.random() * 6), b = 7 + Math.floor(Math.random() * 6);
  openModal('<h2>Kunci untuk Ayah/Ibu 🔒</h2><p class="hint">Jawab pertanyaan ini supaya anak tidak masuk.</p>' +
    '<div class="field"><input type="number" id="gateAns" placeholder="' + a + ' + ' + b + ' = ?" autocomplete="off">' +
    '<button id="gateGo" style="background:#22c55e">Buka</button></div>' +
    '<button class="btn ghost sm" onclick="closeModal()">Batal</button>');
  const go = () => {
    const val = Number($('#gateAns').value);
    if (val === a + b) { closeModal(); parentPanel(); }
    else { toast('Jawaban belum tepat'); $('#gateAns').value = ''; }
  };
  $('#gateGo').onclick = go;
  $('#gateAns').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  setTimeout(()=>$('#gateAns').focus(), 120);
}

function parentPanel(){
  const rs = S.routines();
  const html = '<h2>Pengaturan Ayah/Ibu ⚙️</h2><p class="hint">Perubahan langsung tersimpan di perangkat ini.</p>' +
    '<div class="field"><input type="text" id="pName" value="' + S.name().replace(/"/g,'&quot;') + '">' +
    '<button id="pNameSave" style="background:#22c55e">Simpan</button></div>' +
    '<div class="field"><input type="number" id="pTarget" value="' + S.target() + '" min="1" max="100">' +
    '<button id="pTargetSave" style="background:#22c55e">Target ⭐</button></div>' +
    '<h2 style="font-size:17px;margin-top:18px">Kegiatan harian</h2>' +
    '<div id="pRoutines"></div>' +
    '<div class="field" style="margin-top:10px"><input type="text" id="pNewEm" value="🧩" style="max-width:64px;text-align:center">' +
    '<input type="text" id="pNewTx" placeholder="Kegiatan baru…">' +
    '<button id="pAddR" style="background:#22c55e">+</button></div>' +
    '<h2 style="font-size:17px;margin-top:18px">Daftar hadiah</h2>' +
    '<div id="pRewards"></div>' +
    '<div class="field" style="margin-top:10px"><input type="text" id="pNewRw" placeholder="Hadiah baru…">' +
    '<button id="pAddRw" style="background:#22c55e">+</button></div>' +
    '<button class="btn" id="pClose">Selesai</button>' +
    '<button class="btn ghost sm" id="pResetStars">↺ Nolkan bintang (' + S.stars() + ')</button>' +
    '<button class="btn ghost sm" id="pResetDay">↺ Kosongkan tanda kegiatan hari ini</button>';
  openModal(html);

  const drawR = () => {
    const box = $('#pRoutines'); box.innerHTML = '';
    S.routines().forEach((r, i) => {
      const d = document.createElement('div'); d.className = 'rowline';
      d.innerHTML = '<span class="em">' + r.em + '</span><span class="tx">' + r.tx + '</span>' +
        '<button data-i="' + i + '" data-a="up">↑</button><button data-i="' + i + '" data-a="del">Hapus</button>';
      box.appendChild(d);
    });
    box.onclick = (e) => {
      const i = Number(e.target.getAttribute && e.target.getAttribute('data-i'));
      const a = e.target.getAttribute && e.target.getAttribute('data-a');
      if (isNaN(i) || !a) return;
      const arr = S.routines();
      if (a === 'del') arr.splice(i, 1);
      if (a === 'up' && i > 0) { const t = arr[i-1]; arr[i-1] = arr[i]; arr[i] = t; }
      LS.set('af_routines', arr); drawR(); refreshOpen();
    };
  };
  const drawW = () => {
    const box = $('#pRewards'); box.innerHTML = '';
    S.rewards().forEach((r, i) => {
      const d = document.createElement('div'); d.className = 'rowline';
      d.innerHTML = '<span class="em">🎁</span><span class="tx">' + r + '</span><button data-i="' + i + '">Hapus</button>';
      box.appendChild(d);
    });
    box.onclick = (e) => {
      const i = Number(e.target.getAttribute && e.target.getAttribute('data-i'));
      if (isNaN(i)) return;
      const arr = S.rewards(); arr.splice(i, 1); LS.set('af_rewards', arr); drawW();
    };
  };
  const refreshOpen = () => { if ($('#modal').classList.contains('on')) { /* keep panel open */ } };
  drawR(); drawW();

  $('#pNameSave').onclick = () => { const n = $('#pName').value.trim(); if (!n) return toast('Nama belum diisi'); LS.set('af_name', n); toast('Nama disimpan'); };
  $('#pTargetSave').onclick = () => { const n = Math.max(1, Math.min(100, Number($('#pTarget').value) || 10)); LS.set('af_target', n); $('#pTarget').value = n; toast('Target: ' + n + ' bintang'); };
  $('#pAddR').onclick = () => {
    const em = $('#pNewEm').value.trim() || '🧩', tx = $('#pNewTx').value.trim();
    if (!tx) return toast('Tulis nama kegiatannya');
    const arr = S.routines(); arr.push({ id: 'r' + Date.now(), em: em, tx: tx }); LS.set('af_routines', arr);
    $('#pNewTx').value = ''; drawR(); toast('Kegiatan ditambah');
  };
  $('#pAddRw').onclick = () => {
    const tx = $('#pNewRw').value.trim(); if (!tx) return toast('Tulis hadiahnya');
    const arr = S.rewards(); arr.push(tx); LS.set('af_rewards', arr); $('#pNewRw').value = ''; drawW(); toast('Hadiah ditambah');
  };
  $('#pClose').onclick = () => { closeModal(); render(stack[stack.length-1] || 'home', false); };
  $('#pResetStars').onclick = () => { if (confirm('Nolkan semua bintang?')) { LS.set('af_stars', 0); toast('Bintang dinolkan'); } };
  $('#pResetDay').onclick = () => { LS.set('af_today', { d: todayKey(), done: [] }); toast('Tanda kegiatan hari ini dikosongkan'); };
}
window.closeModal = closeModal;

/* ---------- start ---------- */
document.addEventListener('click', () => { const c = ac(); if (c && c.state === 'suspended') c.resume(); }, { once: true });
render('home', true);
</script>
