<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Al Fatih — Belajar, Bintang &amp; Rutinitas</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;
    background:radial-gradient(circle at 15% 0%,#155e52 0%,#0b2545 55%,#071528 100%);
    background-attachment:fixed;color:#f8fafc;overflow-x:hidden;
  }
  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
    padding:10px 12px;background:rgba(7,21,40,.88);backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,.10)}
  header h1{font-size:19px;margin:0;flex:1;text-align:center;font-weight:800;letter-spacing:.3px}
  .ico-btn{width:46px;height:46px;flex:0 0 46px;border:none;border-radius:14px;cursor:pointer;
    background:rgba(255,255,255,.12);color:#fff;font-size:22px;line-height:1;
    display:flex;align-items:center;justify-content:center}
  .ico-btn:active{transform:scale(.93)}
  main{padding:14px 14px 40px;max-width:820px;margin:0 auto}
  .hello{background:linear-gradient(135deg,#f59e0b,#f97316);border-radius:24px;padding:18px;
    margin-bottom:16px;box-shadow:0 10px 30px rgba(249,115,22,.30);color:#3b1d00}
  .hello .nm{font-size:clamp(26px,7vw,38px);font-weight:900;line-height:1.1;margin:2px 0 6px}
  .hello .sub{font-size:15px;font-weight:700;opacity:.85}
  .hello .say{margin-top:12px;background:rgba(255,255,255,.55);border:none;border-radius:14px;
    padding:10px 16px;font-size:16px;font-weight:800;color:#3b1d00;cursor:pointer;font-family:inherit}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .tile{border:none;border-radius:22px;padding:20px 12px;cursor:pointer;color:#08172e;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    min-height:130px;box-shadow:0 8px 22px rgba(0,0,0,.28);font-family:inherit}
  .tile:active{transform:scale(.96)}
  .tile .em{font-size:46px;line-height:1}
  .tile .lb{font-size:18px;font-weight:900;text-align:center}
  .t1{background:linear-gradient(150deg,#fca5a5,#f87171)}
  .t2{background:linear-gradient(150deg,#93c5fd,#3b82f6)}
  .t3{background:linear-gradient(150deg,#86efac,#22c55e)}
  .t4{background:linear-gradient(150deg,#fde68a,#fbbf24)}
  .t5{background:linear-gradient(150deg,#c4b5fd,#8b5cf6)}
  .t6{background:linear-gradient(150deg,#f9a8d4,#ec4899)}
  .t7{background:linear-gradient(150deg,#fdba74,#fb923c)}
  .grid-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
  .lbtn{aspect-ratio:1/1;border:none;border-radius:18px;cursor:pointer;font-family:inherit;
    font-size:clamp(26px,6.5vw,40px);font-weight:900;color:#08172e;
    display:flex;align-items:center;justify-content:center;box-shadow:0 5px 14px rgba(0,0,0,.25)}
  .lbtn:active{transform:scale(.93)}
  .c1{background:#a7f3d0}.c2{background:#bfdbfe}.c3{background:#fde68a}
  .c4{background:#fecaca}.c5{background:#ddd6fe}.c6{background:#fbcfe8}
  .hbtn{background:#e2e8f0;font-size:clamp(30px,8vw,46px)}
  .prog-note{font-size:14px;opacity:.78;margin:0 0 12px;line-height:1.5}
  .routine{display:flex;flex-direction:column;gap:12px}
  .rrow{display:flex;align-items:center;gap:14px;border:2px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.07);border-radius:20px;padding:14px 16px;cursor:pointer;
    font-family:inherit;color:#fff;text-align:left;width:100%}
  .rrow:active{transform:scale(.985)}
  .rrow .ri{font-size:36px;line-height:1;width:46px;text-align:center}
  .rrow .rl{font-size:19px;font-weight:800;flex:1}
  .rrow .rc{width:40px;height:40px;flex:0 0 40px;border-radius:50%;
    border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:20px}
  .rrow.done{background:linear-gradient(120deg,rgba(34,197,94,.28),rgba(34,197,94,.12));border-color:#22c55e}
  .rrow.done .rc{background:#22c55e;border-style:solid;border-color:#22c55e}
  .rrow.done .rl{text-decoration:line-through;opacity:.8}
  .bar{height:16px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin:14px 0 6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);width:0;transition:width .4s}
  .starwrap{text-align:center;padding:8px 0 4px}
  .bigstar{font-size:78px;line-height:1;filter:drop-shadow(0 8px 18px rgba(250,204,21,.5))}
  .starcount{font-size:clamp(46px,13vw,68px);font-weight:900;margin:6px 0 0;color:#fde047}
  .starwrap p{margin:6px 0 0;opacity:.85;font-size:15px}
  .btn{display:block;width:100%;border:none;border-radius:18px;padding:18px;font-size:19px;
    font-weight:900;font-family:inherit;cursor:pointer;margin-top:16px;
    background:linear-gradient(135deg,#facc15,#f59e0b);color:#3b1d00}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
  .btn.sm{padding:12px;font-size:16px;border-radius:14px;margin-top:8px}
  .btn.green{background:linear-gradient(135deg,#4ade80,#22c55e);color:#04220f}
  .rewlist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .rew{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
    border-radius:16px;padding:14px 16px;font-size:17px;font-weight:700}
  #overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(4,12,24,.94);padding:20px}
  #overlay.on{display:flex}
  .card{width:100%;max-width:520px;text-align:center;border-radius:28px;padding:26px 20px 22px;position:relative}
  .card .huge{font-size:clamp(90px,34vw,190px);font-weight:900;line-height:.95}
  .card .arab{font-size:clamp(100px,36vw,200px);line-height:1.1}
  .card .word{font-size:clamp(26px,8vw,40px);font-weight:900;margin-top:6px}
  .card .em{font-size:clamp(50px,16vw,80px);line-height:1.2;margin-top:6px}
  .card .cnt{font-size:clamp(22px,6vw,32px);line-height:1.4;margin-top:10px;word-break:break-word}
  .card .tip{font-size:15px;font-weight:700;opacity:.7;margin-top:14px}
  .card .close{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:50%;
    border:none;background:rgba(0,0,0,.18);color:#08172e;font-size:22px;cursor:pointer}
  .navrow{display:flex;gap:12px;justify-content:center;margin-top:18px}
  .navrow button{border:none;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:800;
    background:rgba(0,0,0,.18);color:#08172e;cursor:pointer;font-family:inherit}
  #modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(4,12,24,.9);padding:18px}
  #modal.on{display:flex}
  .sheet{background:#0f2136;border:1px solid rgba(255,255,255,.14);border-radius:22px;
    padding:20px;width:100%;max-width:560px;max-height:88vh;overflow:auto}
  .sheet h2{margin:0 0 6px;font-size:20px}
  .sheet h3{font-size:16px;margin:18px 0 8px;opacity:.9}
  .sheet p.hint{margin:0 0 14px;font-size:14px;opacity:.75}
  .tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
  .tabs button{flex:1;min-width:80px;border:none;border-radius:12px;padding:10px 6px;font-size:13.5px;
    font-weight:800;background:rgba(255,255,255,.09);color:#cbd5e1;cursor:pointer;font-family:inherit}
  .tabs button.on{background:#facc15;color:#3b1d00}
  .field{display:flex;gap:8px;margin-bottom:10px;align-items:center}
  .field input[type=text],.field input[type=number],.field input[type=date]{
    flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    border-radius:12px;padding:12px;color:#fff;font-size:16px;font-family:inherit}
  .field input::placeholder{color:#94a3b8}
  .field button{border:none;border-radius:12px;padding:12px 14px;background:#ef4444;color:#fff;
    font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
  .rowline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.09)}
  .rowline span.em{font-size:24px}
  .rowline span.tx{flex:1;font-size:16px;font-weight:700}
  .rowline span.sm{font-size:13px;opacity:.7;font-weight:600}
  .rowline button{border:none;border-radius:10px;padding:8px 12px;background:rgba(255,255,255,.14);
    color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .kv{display:flex;gap:10px;margin-top:12px}
  .kv div{flex:1;background:rgba(255,255,255,.07);border-radius:14px;padding:12px;text-align:center}
  .kv b{display:block;font-size:22px;color:#fde047}
  .kv span{font-size:12.5px;opacity:.75}
  .chart{display:flex;align-items:flex-end;gap:6px;height:168px;margin-top:12px;
    background:rgba(255,255,255,.05);border-radius:14px;padding:10px;box-sizing:border-box}
  .chart .cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
  .chart .cb i{display:block;width:100%;min-height:8px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#38bdf8,#0284c7)}
  .chart .cb em{font-size:10.5px;font-style:normal;opacity:.7;white-space:nowrap}
  .kuis-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .kuis-top .pill{background:rgba(255,255,255,.12);border-radius:99px;padding:8px 16px;font-weight:800;font-size:15px}
  .kuis-q{text-align:center;background:rgba(255,255,255,.08);border-radius:20px;padding:16px;margin-bottom:16px}
  .kuis-q .qq{font-size:clamp(20px,5.5vw,28px);font-weight:900}
  .kuis-q .qh{font-size:14px;opacity:.75;margin-top:6px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opt{border:none;border-radius:22px;padding:22px 8px;font-size:clamp(34px,11vw,56px);font-weight:900;
    cursor:pointer;font-family:inherit;color:#08172e;box-shadow:0 8px 20px rgba(0,0,0,.28);min-height:110px}
  .opt:active{transform:scale(.95)}
  .opt.right{background:linear-gradient(150deg,#86efac,#22c55e)!important;animation:pulse .5s}
  .opt.wrong{background:linear-gradient(150deg,#fca5a5,#ef4444)!important;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.09)}100%{transform:scale(1)}}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#111827;border:1px solid rgba(255,255,255,.2);color:#fff;padding:12px 20px;
    border-radius:99px;font-weight:800;opacity:0;transition:.3s;z-index:90;pointer-events:none;font-size:15px}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .fly{position:fixed;z-index:70;font-size:40px;pointer-events:none;transition:all .9s cubic-bezier(.2,.8,.2,1)}
  .conf{position:fixed;top:-40px;z-index:70;font-size:30px;pointer-events:none;animation:fall 1.9s linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.15}}
  footer{text-align:center;font-size:12.5px;opacity:.45;padding:6px 0 26px}
</style>
</head>
<body>
<header>
  <button class="ico-btn" id="btnBack" title="Kembali">←</button>
  <h1 id="ttl">Al Fatih</h1>
  <button class="ico-btn" id="btnHome" title="Beranda">🏠</button>
</header>
<main id="view"></main>
<footer>Dibuat untuk Al Fatih • <span id="footnote">buka di HP atau laptop, bisa tanpa internet</span></footer>

<div id="overlay"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Al Fatih v2 — belajar huruf/angka/hijaiyah, kuis, rutinitas,
   papan bintang, hadiah, catatan tumbuh kembang.
   Data tersimpan di perangkat (localStorage). Suara: file MP3
   ElevenLabs bila ada, kalau tidak pakai suara bawaan perangkat.
   ============================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

/* ---------- data bawaan ---------- */
const DEF_ROUTINES = [
  { id:'r1',  em:'🌞', tx:'Bangun pagi' },
  { id:'r2',  em:'🤗', tx:'Peluk Ayah & Ibu' },
  { id:'r3',  em:'🪥', tx:'Sikat gigi' },
  { id:'r4',  em:'🚿', tx:'Mandi' },
  { id:'r5',  em:'🍳', tx:'Sarapan' },
  { id:'r6',  em:'📖', tx:'Ngaji & belajar' },
  { id:'r7',  em:'🍛', tx:'Makan siang' },
  { id:'r8',  em:'😴', tx:'Tidur siang' },
  { id:'r9',  em:'🧸', tx:'Main & rapikan mainan' },
  { id:'r10', em:'🍽️', tx:'Makan malam' },
  { id:'r11', em:'🪥', tx:'Sikat gigi malam' },
  { id:'r12', em:'🌙', tx:'Tidur malam' }
];
const DEF_REWARDS = [
  'Pelukan hangat 🤗','Ciuman sayang 😘','Peluk + gelitik 🤣','Jalan-jalan sore 🛴',
  'Baca buku bersama 📚','Es krim kecil 🍦','Main di taman 🛝','Nonton kartun 15 menit 📺',
  'Naik motor keliling 🏍️'
];
const LETTERS = [
  ['A','Apel','🍎'],['B','Bola','⚽'],['C','Cicak','🦎'],['D','Domba','🐑'],
  ['E','Ember','🪣'],['F','Foto','📷'],['G','Gajah','🐘'],['H','Harimau','🐯'],
  ['I','Ikan','🐟'],['J','Jeruk','🍊'],['K','Kucing','🐱'],['L','Lampu','💡'],
  ['M','Mata','👁️'],['N','Nanas','🍍'],['O','Obat','💊'],['P','Pisang','🍌'],
  ['Q','Quran','📖'],['R','Rumah','🏠'],['S','Sepatu','👟'],['T','Topi','🧢'],
  ['U','Ular','🐍'],['V','Vas','🏺'],['W','Wortel','🥕'],['X','Xilofon','🎹'],
  ['Y','Yoyo','🪀'],['Z','Zebra','🦓']
];
const HIJAIYAH = [
  ['ا','Alif','a'],['ب','Ba','ba'],['ت','Ta','ta'],['ث','Tsa','tsa'],
  ['ج','Jim','ja'],['ح','Ha','ha'],['خ','Kha','kha'],['د','Dal','da'],
  ['ذ','Dzal','dza'],['ر','Ra','ra'],['ز','Zai','za'],['س','Sin','sa'],
  ['ش','Syin','sya'],['ص','Shad','sha'],['ض','Dhad','dha'],['ط','Tha','tha'],
  ['ظ','Zha','zha'],['ع',"'Ain","'a"],['غ','Ghain','gha'],['ف','Fa','fa'],
  ['ق','Qaf','qa'],['ك','Kaf','ka'],['ل','Lam','la'],['م','Mim','ma'],
  ['ن','Nun','na'],['و','Wau','wa'],['ه','Ha','ha'],['ي','Ya','ya']
];
const ANGKA_KATA = ['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh',
  'sebelas','dua belas','tiga belas','empat belas','lima belas','enam belas','tujuh belas','delapan belas',
  'sembilan belas','dua puluh'];
const COUNT_EMOJI = ['🍎','⚽','🐟','⭐','🧸','🌸','🍌','🐥','🎈','🍓'];

/* ---------- state ---------- */
const S = {
  name:     () => LS.get('af_name', 'Al Fatih'),
  routines: () => LS.get('af_routines', DEF_ROUTINES),
  rewards:  () => LS.get('af_rewards', DEF_REWARDS),
  target:   () => LS.get('af_target', 10),
  stars:    () => LS.get('af_stars', 0),
  addStars: (n) => { const v = Math.max(0, S.stars() + n); LS.set('af_stars', v); S.logStar(n); return v; },
  today:    () => { const t = LS.get('af_today', { d:'', done:[] }); return t.d === todayKey() ? t : { d: todayKey(), done: [] }; },
  saveToday:(t) => LS.set('af_today', t),
  history:  () => LS.get('af_history', []),
  logStar(n){ const h = S.history(); const t = todayKey();
    let e = h.find(x => x.d === t);
    if (!e) { e = { d:t, n:0 }; h.push(e); }
    e.n += n; LS.set('af_history', h); },
  growth:   () => LS.get('af_growth', []),
  saveGrowth:(g) => LS.set('af_growth', g),
  kuisTotal:() => LS.get('af_kuis_total', 0),
  kuisBenar:() => LS.get('af_kuis_benar', 0)
};

/* ---------- audio: MP3 ElevenLabs + fallback suara perangkat ---------- */
const AUD = { ready:false, base:'audio/', el:null };
(function initAudio(){
  try {
    fetch('audio/manifest.json', { cache:'no-store' })
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(j => { AUD.ready = Array.isArray(j.files) && j.files.length > 0; })
      .catch(() => { AUD.ready = false; });
  } catch (e) { AUD.ready = false; }
})();
let VOICES = [];
function loadVoices(){ try { VOICES = window.speechSynthesis.getVoices() || []; } catch (e) { VOICES = []; } }
if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 500); }
function pickVoice(prefix){
  const list = VOICES.length ? VOICES : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
  return list.find(v => (v.lang||'').toLowerCase().replace('_','-').startsWith(prefix))
      || list.find(v => (v.lang||'').toLowerCase().startsWith(prefix.slice(0,2))) || null;
}
function tts(text, lang, rate){
  if (!window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'id-ID';
    const v = pickVoice(u.lang); if (v) u.voice = v;
    u.rate = rate || 0.85; u.pitch = 1.15; u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
/* putar file MP3 bila ada; kalau tidak ada/gagal, pakai suara perangkat */
function say(file, fallbackText, fallbackLang, rate){
  const fb = () => { if (fallbackText) tts(fallbackText, fallbackLang || 'id-ID', rate); };
  if (!AUD.ready) { fb(); return; }
  try {
    if (AUD.el) { try { AUD.el.pause(); } catch (e) {} AUD.el = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const a = new Audio(AUD.base + file);
    AUD.el = a;
    let done = false;
    const fail = () => { if (done) return; done = true; fb(); };
    a.addEventListener('error', fail);
    const pr = a.play();
    if (pr && pr.catch) pr.catch(fail);
    setTimeout(() => { if (!done && a.paused && a.currentTime === 0) fail(); }, 900);
  } catch (e) { fb(); }
}
function stopAudio(){
  if (AUD.el) { try { AUD.el.pause(); } catch (e) {} AUD.el = null; }
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}
/* pemetaan nama file audio */
const A = {
  letter:(i) => 'huruf_' + LETTERS[i][0].toLowerCase() + '.mp3',
  number:(n) => 'angka_' + n + '.mp3',
  hij:(i)   => (LS.get('af_hij_mode', 'nama') === 'arab' ? 'hijaiyah_ar_' : 'hijaiyah_') + String(i+1).padStart(2,'0') + '.mp3',
  routine:(r) => 'rutin_' + r.id + '.mp3',
  reward:(i) => 'hadiah_' + (i+1) + '.mp3',
  ph:(k) => 'frasa_' + k + '.mp3'
};
const PH = {
  pagi:['Selamat pagi, sayang','sapa_pagi'], siang:['Selamat siang, sayang','sapa_siang'],
  sore:['Selamat sore, sayang','sapa_sore'], malam:['Selamat malam, sayang','sapa_malam'],
  alhamdulillah:['Alhamdulillah!','alhamdulillah'],
  semua:['Alhamdulillah! Semua kegiatan hari ini selesai!','semua_selesai'],
  cobaLagi:['Coba lagi ya, sayang','coba_lagi'],
  benar:['Benar! Pintar!','benar'],

/* ---------- suara efek ---------- */
let AC = null;
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function tone(f, delay, dur, gain, type){
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain || 0.14, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.18));
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + (dur||0.18) + 0.05);
}
function chime(){ tone(784,0,.16); tone(1046,.11,.18); tone(1568,.22,.3); }
function pop(){ tone(520,0,.09,.1,'triangle'); }
function buzz(){ tone(200,0,.18,.12,'sawtooth'); tone(150,.16,.22,.12,'sawtooth'); }
function fanfare(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f, i*.11, .3, .16)); }

/* ---------- efek ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1900); }
function flyStar(fromEl){
  try {
    const r = fromEl ? fromEl.getBoundingClientRect() : { left:innerWidth/2, top:innerHeight/2, width:0, height:0 };
    const s = document.createElement('div'); s.className = 'fly'; s.textContent = '⭐';
    s.style.left = (r.left + r.width/2) + 'px'; s.style.top = (r.top + r.height/2) + 'px';
    document.body.appendChild(s);
    requestAnimationFrame(()=>{ s.style.transform = 'translate(-50%,-50%) scale(1.4)'; });
    setTimeout(()=>{ s.style.left = (innerWidth/2)+'px'; s.style.top = '70px';
      s.style.transform = 'translate(-50%,-50%) scale(.3)'; s.style.opacity = '.2'; }, 30);
    setTimeout(()=>s.remove(), 1000);
  } catch (e) {}
}
function confetti(){
  const em = ['⭐','🎉','✨','🌟','🎈','💚','🤗'];
  for (let i = 0; i < 26; i++) {
    const d = document.createElement('div'); d.className = 'conf'; d.textContent = em[i % em.length];
    d.style.left = (Math.random()*94 + 2) + 'vw';
    d.style.animationDelay = (Math.random()*0.6) + 's';
    d.style.fontSize = (22 + Math.random()*22) + 'px';
    document.body.appendChild(d); setTimeout(()=>d.remove(), 2800);
  }
}

let stack = [];
function setTitle(t){ $('#ttl').textContent = t; }
function render(name, push){
  if (push !== false) { if (stack[stack.length-1] !== name) stack.push(name); }
  const v = $('#view'); v.innerHTML = '';
  (VIEWS[name] || VIEWS.home)(v);
  window.scrollTo(0,0);
}

  if ($('#modal').classList.contains('on')) { closeModal(); return; }
  stopAudio();
  if (stack.length > 1) { stack.pop(); const prev = stack[stack.length-1]; stack.pop(); render(prev, true); }

};

function newQuestion(){
  const box = $('#opts'); if (!box) return;
  K.locked = false;
  const pool = K.cat === 'huruf' ? LETTERS.length : 20;
  K.target = Math.floor(Math.random() * pool);
  const opts = [K.target];
  while (opts.length < 4) { const c = Math.floor(Math.random() * pool); if (opts.indexOf(c) < 0) opts.push(c); }
  opts.sort(() => Math.random() - 0.5);
  K.opts = opts;

  const qt = $('#qtext'), qh = $('#qhint');
  if (K.cat === 'huruf')      { qt.textContent = 'Mana huruf ' + LETTERS[K.target][0] + '?'; qh.textContent = 'dengarkan lalu sentuh hurufnya'; }
  else if (K.cat === 'angka') { qt.textContent = 'Mana angka ' + K.target + '?';            qh.textContent = 'dengarkan lalu sentuh angkanya'; }
  else                        { qt.textContent = 'Mana huruf ' + HIJAIYAH[K.target][1] + '?'; qh.textContent = 'dengarkan lalu sentuh hurufnya'; }

  box.innerHTML = '';
  opts.forEach((o, idx) => {

  if (K.cat === 'huruf')      say(A.letter(K.target), 'Mana huruf ' + LETTERS[K.target][0] + '?', 'id-ID', 0.8);
  else if (K.cat === 'angka') say(A.number(K.target), 'Mana angka ' + K.target + '?', 'id-ID', 0.75);
  else                        say(A.hij(K.target), 'Mana huruf ' + HIJAIYAH[K.target][1] + '?', 'ar-SA', 0.75);

function answer(o, btn){
  if (K.locked) return;
  if (o === K.target) {
    K.locked = true; K.benar++;
    btn.classList.add('right');

    LS.set('af_kuis_total', S.kuisTotal() + 1);

}

  v.appendChild(wrap);

  const bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = '<i style="width:' + Math.round(t.done.length / Math.max(1, rs.length) * 100) + '%"></i>';
  v.appendChild(bar);
  const note = document.createElement('p'); note.className = 'prog-note';
  note.textContent = t.done.length + ' dari ' + rs.length + ' kegiatan selesai hari ini.';
  v.appendChild(note);
};

/* ================= PAPAN BINTANG ================= */
VIEWS.bintang = (v) => {
  setTitle('Papan Bintang');
  const st = S.stars(), tg = S.target(), left = Math.max(0, tg - st);
  const w = document.createElement('div'); w.className = 'starwrap';
  w.innerHTML = '<div class="bigstar">' + (st >= tg ? '🏆' : '⭐') + '</div>' +
    '<div class="starcount">' + st + '</div>' +
    '<p>' + (st >= tg ? 'Bintangnya penuh! Tukar hadiah yuk!' : 'Kumpulkan ' + left + ' bintang lagi untuk hadiah 🎁') + '</p>';
  v.appendChild(w);
  const bar = document.createElement('div'); bar.className = 'bar';
  bar.innerHTML = '<i style="width:' + Math.min(100, Math.round(st / Math.max(1,tg) * 100)) + '%"></i>';
  v.appendChild(bar);
  const n = document.createElement('p'); n.className = 'prog-note';
  n.textContent = 'Target: ' + tg + ' bintang = 1 hadiah';
  v.appendChild(n);

  const btn = document.createElement('button');
  btn.className = 'btn'; btn.textContent = '🎁 Tukar Bintang Sekarang';
  btn.disabled = st < tg;
  btn.onclick = () => {
    const rw = S.rewards();
    const idx = Math.floor(Math.random() * rw.length);
    const pick = rw[idx];
    LS.set('af_stars', Math.max(0, st - tg));
    LS.set('af_lastReward', { d: todayKey(), t: pick });
    confetti(); fanfare();
    openOverlay(
      '<button class="close">✕</button>' +
      '<div class="em">🎁</div>' +
      '<div class="word">Hadiah untuk ' + esc(S.name()) + '!</div>' +
      '<div class="huge" style="font-size:clamp(40px,11vw,64px)">' + esc(pick) + '</div>' +
      '<div class="tip">bintang berkurang ' + tg + ' ⭐ — ayo kumpulkan lagi!</div>',
      'linear-gradient(150deg,#fbcfe8,#f9a8d4)');
    setTimeout(() => say(A.reward(idx), 'Hadiah untukmu! ' + pick), 250);
  };
  v.appendChild(btn);

  const last = LS.get('af_lastReward', null);
  if (last) { const p = document.createElement('p'); p.className = 'prog-note'; p.textContent = 'Hadiah terakhir: ' + last.t; v.appendChild(p); }

  const hb = document.createElement('button');
  hb.className = 'btn ghost sm'; hb.textContent = '📅 Lihat riwayat bintang';
  hb.onclick = () => {
    const h = S.history().slice(-14).reverse();
    openModal('<h2>Riwayat Bintang</h2><p class="hint">14 hari terakhir</p>' +
      (h.length ? h.map(x => '<div class="rowline"><span class="em">⭐</span><span class="tx">' + x.d +
        '</span><span class="sm">' + x.n + ' bintang</span></div>').join('') : '<p class="prog-note">Belum ada catatan.</p>') +
      '<button class="btn sm" onclick="closeModal()">Tutup</button>');
  };
  v.appendChild(hb);
};

VIEWS.hadiah = (v) => {
  setTitle('Daftar Hadiah');
  const p = document.createElement('p'); p.className = 'prog-note';
  p.textContent = 'Setiap tukar bintang, hadiahnya dipilih acak dari daftar ini — jadi selalu berubah.';
  v.appendChild(p);
  const list = document.createElement('div'); list.className = 'rewlist';
  S.rewards().forEach(r => { const d = document.createElement('div'); d.className = 'rew'; d.textContent = r; list.appendChild(d); });
  v.appendChild(list);
  const b = document.createElement('button');
  b.className = 'btn ghost sm'; b.textContent = '⚙️ Ubah daftar hadiah (Ayah/Ibu)';
  b.onclick = parentGate;
  v.appendChild(b);
};

/* ================= PENGATURAN ORANG TUA ================= */
function parentGate(){
  const a = 6 + Math.floor(Math.random()*6), b = 7 + Math.floor(Math.random()*6);
  openModal('<h2>Kunci untuk Ayah/Ibu 🔒</h2><p class="hint">Jawab pertanyaan ini supaya anak tidak masuk.</p>' +
    '<div class="field"><input type="number" id="gateAns" placeholder="' + a + ' + ' + b + ' = ?" autocomplete="off">' +
    '<button id="gateGo" style="background:#22c55e">Buka</button></div>' +
    '<button class="btn ghost sm" onclick="closeModal()">Batal</button>');
  const go = () => {
    if (Number($('#gateAns').value) === a + b) { closeModal(); parentPanel('umum'); }
    else { toast('Jawaban belum tepat'); $('#gateAns').value = ''; }
  };
  $('#gateGo').onclick = go;
  $('#gateAns').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  setTimeout(()=>$('#gateAns').focus(), 120);
}

function parentPanel(tab){
  tab = tab || 'umum';
  openModal('<h2>Pengaturan Ayah/Ibu ⚙️</h2><p class="hint">Semua perubahan langsung tersimpan di perangkat ini.</p>' +
    '<div class="tabs" id="pTabs">' +
      '<button data-t="umum">Umum</button>' +
      '<button data-t="kegiatan">Kegiatan</button>' +
      '<button data-t="hadiah">Hadiah</button>' +
      '<button data-t="tumbuh">Tumbuh Kembang</button>' +
    '</div><div id="pBody"></div>' +
    '<button class="btn" id="pClose">Selesai</button>');
  $$('#pTabs button').forEach(b => {
    if (b.getAttribute('data-t') === tab) b.classList.add('on');
    b.onclick = () => parentPanel(b.getAttribute('data-t'));
  });
  $('#pClose').onclick = () => { closeModal(); render(stack[stack.length-1] || 'home', false); };
  ({ umum: pTabUmum, kegiatan: pTabKegiatan, hadiah: pTabHadiah, tumbuh: pTabTumbuh }[tab] || pTabUmum)($('#pBody'));
}

function pTabUmum(box){
  box.innerHTML =
    '<h3>Nama anak</h3>' +
    '<div class="field"><input type="text" id="pName" value="' + esc(S.name()) + '">' +
    '<button id="pNameSave" style="background:#22c55e">Simpan</button></div>' +
    '<h3>Target bintang untuk 1 hadiah</h3>' +
    '<div class="field"><input type="number" id="pTarget" value="' + S.target() + '" min="1" max="100">' +
    '<button id="pTargetSave" style="background:#22c55e">Simpan</button></div>' +
    '<h3>Bintang &amp; data</h3>' +
    '<button class="btn ghost sm" id="pResetStars">↺ Nolkan bintang (sekarang ' + S.stars() + ')</button>' +
    '<button class="btn ghost sm" id="pResetDay">↺ Kosongkan tanda kegiatan hari ini</button>' +
    '<button class="btn ghost sm" id="pResetKuis">↺ Nolkan catatan kuis</button>';
  $('#pNameSave').onclick = () => { const n = $('#pName').value.trim(); if (!n) return toast('Nama belum diisi');
    LS.set('af_name', n); toast('Nama disimpan'); };
  $('#pTargetSave').onclick = () => { const n = Math.max(1, Math.min(100, Number($('#pTarget').value) || 10));
    LS.set('af_target', n); $('#pTarget').value = n; toast('Target: ' + n + ' bintang'); };
  $('#pResetStars').onclick = () => { if (confirm('Nolkan semua bintang?')) { LS.set('af_stars', 0); toast('Bintang dinolkan'); parentPanel('umum'); } };
  $('#pResetDay').onclick = () => { LS.set('af_today', { d: todayKey(), done: [] }); toast('Tanda kegiatan hari ini dikosongkan'); };
  $('#pResetKuis').onclick = () => { LS.set('af_kuis_total', 0); LS.set('af_kuis_benar', 0); toast('Catatan kuis dinolkan'); };
}

function pTabKegiatan(box){
  box.innerHTML = '<h3>Kegiatan harian</h3><div id="pRoutines"></div>' +
    '<div class="field" style="margin-top:10px"><input type="text" id="pNewEm" value="🧩" style="max-width:64px;text-align:center">' +
    '<input type="text" id="pNewTx" placeholder="Kegiatan baru…">' +
    '<button id="pAddR" style="background:#22c55e">+</button></div>';
  const draw = () => {
    const b = $('#pRoutines'); b.innerHTML = '';
    S.routines().forEach((r, i) => {
      const d = document.createElement('div'); d.className = 'rowline';
      d.innerHTML = '<span class="em">' + esc(r.em) + '</span><span class="tx">' + esc(r.tx) + '</span>' +
        '<button data-i="' + i + '" data-a="up">↑</button><button data-i="' + i + '" data-a="del">Hapus</button>';
      b.appendChild(d);
    });
  };
  draw();
  $('#pRoutines').onclick = (e) => {
    const i = Number(e.target.getAttribute && e.target.getAttribute('data-i'));
    const a = e.target.getAttribute && e.target.getAttribute('data-a');
    if (isNaN(i) || !a) return;
    const arr = S.routines();
    if (a === 'del') arr.splice(i, 1);
    if (a === 'up' && i > 0) { const t = arr[i-1]; arr[i-1] = arr[i]; arr[i] = t; }
    LS.set('af_routines', arr); draw();
  };
  $('#pAddR').onclick = () => {
    const em = $('#pNewEm').value.trim() || '🧩', tx = $('#pNewTx').value.trim();
    if (!tx) return toast('Tulis nama kegiatannya');
    const arr = S.routines(); arr.push({ id:'r' + Date.now(), em: em, tx: tx }); LS.set('af_routines', arr);
    $('#pNewTx').value = ''; draw(); toast('Kegiatan ditambah');
  };
}

function pTabHadiah(box){
  box.innerHTML = '<h3>Daftar hadiah (dipilih acak saat tukar bintang)</h3><div id="pRewards"></div>' +
    '<div class="field" style="margin-top:10px"><input type="text" id="pNewRw" placeholder="Hadiah baru…">' +
    '<button id="pAddRw" style="background:#22c55e">+</button></div>';
  const draw = () => {
    const b = $('#pRewards'); b.innerHTML = '';
    S.rewards().forEach((r, i) => {
      const d = document.createElement('div'); d.className = 'rowline';
      d.innerHTML = '<span class="em">🎁</span><span class="tx">' + esc(r) + '</span><button data-i="' + i + '">Hapus</button>';
      b.appendChild(d);
    });
  };
  draw();
  $('#pRewards').onclick = (e) => {
    const i = Number(e.target.getAttribute && e.target.getAttribute('data-i'));
    if (isNaN(i)) return;
    const arr = S.rewards(); arr.splice(i,1); LS.set('af_rewards', arr); draw();
  };
  $('#pAddRw').onclick = () => {
    const tx = $('#pNewRw').value.trim(); if (!tx) return toast('Tulis hadiahnya');
    const arr = S.rewards(); arr.push(tx); LS.set('af_rewards', arr); $('#pNewRw').value = ''; draw(); toast('Hadiah ditambah');
  };
}

function pTabTumbuh(box){
  const g = S.growth().slice().sort((a,b) => (a.d < b.d ? -1 : 1));
  const last = g[g.length - 1] || null;
  const first = g[0] || null;
  const gainCm = (last && first && last.cm && first.cm) ? (last.cm - first.cm) : null;

  let chart = '';
  const withKg = g.filter(x => x.kg).slice(-8);
  if (withKg.length) {
    const mx = Math.max.apply(null, withKg.map(x => x.kg));
    const mn = Math.min.apply(null, withKg.map(x => x.kg));
    const span = Math.max(0.5, mx - mn);
    chart = '<div class="chart">' + withKg.map(x => {
      const h = Math.round(((x.kg - mn) / span) * 96) + 20;
      return '<div class="cb"><em>' + x.kg + '</em><i style="height:' + h + 'px"></i><em>' + x.d.slice(5) + '</em></div>';
    }).join('') + '</div>';
  }

  box.innerHTML =
    '<h3>Catatan baru</h3>' +
    '<div class="field"><input type="date" id="gDate" value="' + todayKey() + '"></div>' +
    '<div class="field"><input type="number" id="gCm" placeholder="Tinggi (cm)" step="0.1">' +
    '<input type="number" id="gKg" placeholder="Berat (kg)" step="0.1"></div>' +
    '<div class="field"><input type="text" id="gKata" placeholder="Kata/kalimat baru yang muncul…"></div>' +
    '<div class="field"><input type="text" id="gNote" placeholder="Catatan/momen hari ini…"></div>' +
    '<button class="btn green sm" id="gAdd">➕ Simpan catatan</button>' +
    (last ? '<div class="kv">' +
      '<div><b>' + (last.cm || '–') + '</b><span>tinggi terakhir (cm)</span></div>' +
      '<div><b>' + (last.kg || '–') + '</b><span>berat terakhir (kg)</span></div>' +
      (gainCm !== null ? '<div><b>+' + gainCm.toFixed(1) + '</b><span>tambah tinggi (cm)</span></div>' : '') +
      '</div>' : '') +
    (chart ? '<h3>Grafik berat badan</h3>' + chart : '') +
    '<h3>Riwayat</h3><div id="gList"></div>';

  const draw = () => {
    const list = $('#gList'); list.innerHTML = '';
    const arr = S.growth().slice().sort((a,b) => (a.d < b.d ? 1 : -1));
    if (!arr.length) { list.innerHTML = '<p class="prog-note">Belum ada catatan.</p>'; return; }
    arr.forEach((x) => {
      const d = document.createElement('div'); d.className = 'rowline';
      const parts = [];
      if (x.cm) parts.push(x.cm + ' cm');
      if (x.kg) parts.push(x.kg + ' kg');
      if (x.kata) parts.push('💬 ' + x.kata);
      if (x.note) parts.push(x.note);
      d.innerHTML = '<span class="em">📏</span><span class="tx">' + esc(x.d) +
        '<div class="sm">' + esc(parts.join(' • ')) + '</div></span>' +
        '<button data-d="' + esc(x.d) + '">Hapus</button>';
      list.appendChild(d);
    });
  };
  draw();
  $('#gList').onclick = (e) => {
    const d = e.target.getAttribute && e.target.getAttribute('data-d');
    if (!d) return;
    if (!confirm('Hapus catatan ' + d + '?')) return;
    LS.set('af_growth', S.growth().filter(x => x.d !== d));
    parentPanel('tumbuh');
  };
  $('#gAdd').onclick = () => {
    const d = $('#gDate').value || todayKey();
    const cm = parseFloat($('#gCm').value) || null;
    const kg = parseFloat($('#gKg').value) || null;
    const kata = $('#gKata').value.trim();
    const note = $('#gNote').value.trim();
    if (!cm && !kg && !kata && !note) return toast('Isi minimal satu kolom');
    const arr = S.growth().filter(x => x.d !== d);
    arr.push({ d: d, cm: cm, kg: kg, kata: kata, note: note });
    S.saveGrowth(arr);
    toast('Catatan disimpan');
    parentPanel('tumbuh');
  };
}

/* ---------- start ---------- */
document.addEventListener('click', () => { const c = ac(); if (c && c.state === 'suspended') c.resume(); }, { once:true });
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
render('home', true);
</script>
</body>
</html>
