<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14857A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kebun Belajar">
<meta name="description" content="Kebun Belajar Al Fatih — aplikasi belajar anak 3 tahun: huruf, angka, hijaiyah, berhitung, mencocokkan, menggambar. Tanpa iklan, tanpa pelacak, bisa tanpa internet.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Kebun Belajar Al Fatih</title>
<style>
  :root{
    --cream:#FFF8EE; --cream2:#FBEEDC; --ink:#33261A; --ink-soft:#6E5C49;
    --teal:#14857A; --teal-d:#0E6B62; --teal-l:#8FD8CE;
    --coral:#F2705C; --coral-d:#DB4F38;
    --gold:#F2B33D; --gold-l:#FFE1A8;
    --leaf:#5FB86E;
    --line:rgba(51,38,26,.14);
    --card:#FFFFFF;
    --shadow:0 8px 22px rgba(80,55,25,.14);
    --shadow-lg:0 14px 34px rgba(80,55,25,.20);
    --r:22px; --r-lg:28px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans',sans-serif;
    background:linear-gradient(180deg,var(--cream) 0%,var(--cream2) 100%);
    background-attachment:fixed;color:var(--ink);overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }
  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;
    padding:10px max(12px, calc((100% - 820px) / 2 + 12px));background:rgba(255,248,238,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  header h1{font-size:19px;margin:0;flex:1;text-align:center;font-weight:800;letter-spacing:.2px;color:var(--teal-d)}
  .ico-btn{width:48px;height:48px;flex:0 0 48px;border:none;border-radius:16px;cursor:pointer;
    background:#fff;color:var(--teal-d);font-size:22px;line-height:1;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center}
  .ico-btn:active{transform:scale(.93)}
  main{padding:14px 14px 44px;max-width:820px;margin:0 auto}

  /* ---------- beranda ---------- */
  .hello{background:linear-gradient(150deg,#FFF3D8,#FFE6C2);border:1px solid var(--line);border-radius:var(--r-lg);
    padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
  .hello .mascot{width:74px;height:74px;flex:0 0 74px}
  .hello .nm{font-size:clamp(24px,6.5vw,34px);font-weight:900;line-height:1.1;margin:2px 0 4px;color:var(--ink)}
  .hello .sub{font-size:14.5px;font-weight:700;color:var(--ink-soft)}
  .hello .say{margin-top:10px;background:var(--teal);border:none;border-radius:14px;
    padding:10px 16px;font-size:15px;font-weight:800;color:#fff;cursor:pointer;font-family:inherit}
  .hello .say:active{transform:scale(.96)}

  .primary-session{width:100%;border:none;border-radius:var(--r-lg);padding:20px 18px;cursor:pointer;
    background:linear-gradient(145deg,var(--teal),var(--teal-d));color:#fff;text-align:left;box-shadow:var(--shadow-lg);
    font-family:inherit;display:flex;gap:14px;align-items:center;margin-bottom:16px}
  .primary-session:active{transform:scale(.985)}
  .primary-session .ps-ic{font-size:42px;line-height:1}
  .primary-session .ps-body{flex:1;min-width:0;display:block}
  .primary-session .ps-t{display:block;font-size:20px;font-weight:900}
  .primary-session .ps-s{display:block;font-size:14px;font-weight:700;opacity:.9;margin-top:3px}
  .primary-session .ps-go{margin-left:auto;font-size:26px}

  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .tile{border:none;border-radius:var(--r);padding:18px 12px;cursor:pointer;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    min-height:120px;box-shadow:var(--shadow);font-family:inherit;border:1px solid var(--line)}
  .tile:active{transform:scale(.96)}
  .tile .em{font-size:44px;line-height:1}
  .tile .lb{font-size:17px;font-weight:900;text-align:center}
  .t1{background:linear-gradient(150deg,#BCE9E2,#8FD8CE)}
  .t2{background:linear-gradient(150deg,#FFD9A8,#FFC271)}
  .t3{background:linear-gradient(150deg,#FBD0C8,#F5A99B)}
  .t4{background:linear-gradient(150deg,#CDEBC9,#A6DC9E)}
  .t5{background:linear-gradient(150deg,#E3D6F7,#C9B3EC)}
  .t6{background:linear-gradient(150deg,#FFE1A8,#F7CE7B)}
  .t7{background:linear-gradient(150deg,#C7E8F5,#9BD4EA)}
  .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .strip button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 6px;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:12px;color:var(--ink);box-shadow:var(--shadow);display:flex;
    flex-direction:column;align-items:center;gap:4px}
  .strip button:active{transform:scale(.96)}
  .strip .se{font-size:24px}

  /* ---------- kartu huruf/angka ---------- */
  .grid-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
  .lbtn{aspect-ratio:1/1;border:none;border-radius:18px;cursor:pointer;font-family:inherit;
    font-size:clamp(26px,6.5vw,40px);font-weight:900;color:var(--ink);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .lbtn:active{transform:scale(.93)}
  .c1{background:#D9F2EE}.c2{background:#FFE7C4}.c3{background:#FBDAD3}
  .c4{background:#DFF1DC}.c5{background:#E9DFF7}.c6{background:#FFEBC6}
  .hbtn{font-size:clamp(30px,8vw,46px)}
  .prog-note{font-size:14px;color:var(--ink-soft);margin:0 0 12px;line-height:1.5}

  /* ---------- kartu / overlay ---------- */
  #overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(51,38,26,.62);padding:18px;overflow:auto}
  #overlay.on{display:flex}
  .card{width:100%;max-width:540px;text-align:center;border-radius:var(--r-lg);padding:26px 20px 22px;position:relative;
    background:#fff;box-shadow:var(--shadow-lg)}
  .card .huge{font-size:clamp(70px,26vw,140px);font-weight:900;line-height:.95}
  .card .arab{font-size:clamp(90px,32vw,180px);line-height:1.1;font-family:'Traditional Arabic','Amiri',serif}
  .card .word{font-size:clamp(24px,7vw,36px);font-weight:900;margin-top:6px}
  .card .em{font-size:clamp(48px,15vw,76px);line-height:1.2;margin-top:6px}
  .card .cnt{font-size:clamp(20px,5.5vw,30px);line-height:1.4;margin-top:10px;word-break:break-word}
  .card .tip{font-size:14.5px;font-weight:700;color:var(--ink-soft);margin-top:14px}
  .card .close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;
    border:none;background:rgba(51,38,26,.10);color:var(--ink);font-size:22px;cursor:pointer}
  .navrow{display:flex;gap:12px;justify-content:center;margin-top:18px}
  .navrow button{border:none;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:800;
    background:rgba(51,38,26,.10);color:var(--ink);cursor:pointer;font-family:inherit;min-width:64px}

  /* ---------- modal orang tua ---------- */
  #modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    background:rgba(51,38,26,.72);padding:16px}
  #modal.on{display:flex}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);
    padding:20px;width:100%;max-width:580px;max-height:88vh;overflow:auto}
  .sheet h2{margin:0 0 6px;font-size:20px;color:var(--teal-d)}
  .sheet h3{font-size:16px;margin:18px 0 8px;color:var(--ink)}
  .sheet p.hint{margin:0 0 14px;font-size:14px;color:var(--ink-soft);line-height:1.5}
  .tabs{display:flex;gap:6px;margin:10px 0 14px;flex-wrap:wrap}
  .tabs button{flex:1;min-width:78px;border:1px solid var(--line);border-radius:12px;padding:10px 6px;font-size:13.5px;
    font-weight:800;background:#F6EFE3;color:var(--ink-soft);cursor:pointer;font-family:inherit}
  .tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
  .field{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=file]{
    flex:1;min-width:0;background:#FBF5EA;border:1px solid var(--line);
    border-radius:12px;padding:12px;color:var(--ink);font-size:16px;font-family:inherit}
  .field input::placeholder{color:#A99B8A}
  .field button{border:none;border-radius:12px;padding:12px 14px;background:var(--coral-d);color:#fff;
    font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .field button.ok{background:var(--teal)}
  .rowline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rowline:last-child{border-bottom:none}
  .rowline span.em{font-size:24px}
  .rowline span.tx{flex:1;font-size:16px;font-weight:700}
  .rowline span.sm{font-size:13px;color:var(--ink-soft);font-weight:600}
  .rowline button{border:none;border-radius:10px;padding:8px 12px;background:#F0E7D9;
    color:var(--ink);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .kv{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .kv div{flex:1;min-width:96px;background:#FBF5EA;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .kv b{display:block;font-size:22px;color:var(--coral-d)}
  .kv span{font-size:12.5px;color:var(--ink-soft)}

  .btn{display:block;width:100%;border:none;border-radius:18px;padding:18px;font-size:19px;
    font-weight:900;font-family:inherit;cursor:pointer;margin-top:14px;
    background:linear-gradient(135deg,var(--gold),#E89B24);color:#3B2500;box-shadow:var(--shadow)}
  .btn:active{transform:scale(.97)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--line);box-shadow:var(--shadow)}
  .btn.sm{padding:12px;font-size:16px;border-radius:14px;margin-top:8px}
  .btn.green{background:linear-gradient(135deg,#7ACB84,#4FA95D);color:#0C2C13}
  .rewlist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  .rew{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;font-weight:700;box-shadow:var(--shadow)}

  /* ---------- kuis ---------- */
  .kuis-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .kuis-top .pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
  .kuis-q{text-align:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
  .kuis-q .qq{font-size:clamp(19px,5.2vw,26px);font-weight:900}
  .kuis-q .qh{font-size:14px;color:var(--ink-soft);margin-top:6px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .opt{border:none;border-radius:var(--r);padding:22px 8px;font-size:clamp(32px,10vw,52px);font-weight:900;
    cursor:pointer;font-family:inherit;color:var(--ink);box-shadow:var(--shadow);min-height:104px;border:1px solid var(--line)}
  .opt:active{transform:scale(.95)}
  .opt.right{background:linear-gradient(150deg,#A6DC9E,#5FB86E)!important;animation:pulse .5s}
  .opt.wrong{background:linear-gradient(150deg,#F5A99B,#DB4F38)!important;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}

  /* ---------- menghitung ---------- */
  .tap-area{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:#fff;border:1px solid var(--line);
    border-radius:var(--r);padding:18px;min-height:180px;box-shadow:var(--shadow)}
  .tap-obj{border:none;background:none;font-size:clamp(38px,11vw,56px);cursor:pointer;line-height:1;
    transition:transform .18s,opacity .18s;padding:2px;filter:grayscale(.05)}
  .tap-obj.tapped{transform:scale(1.18);opacity:.55}
  .tap-count{text-align:center;font-size:clamp(28px,8vw,44px);font-weight:900;color:var(--teal-d);margin:14px 0 4px}

  /* ---------- mencocokkan ---------- */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .mcard{aspect-ratio:1/1;border:none;border-radius:16px;cursor:pointer;font-size:clamp(26px,8vw,40px);
    background:linear-gradient(150deg,var(--teal),var(--teal-d));color:transparent;box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;font-family:inherit;border:1px solid var(--line)}
  .mcard.open,.mcard.matched{background:#fff;color:var(--ink)}
  .mcard.matched{opacity:.75}

  /* ---------- menggambar ---------- */
  .pad-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:10px}
  .pad-hint{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:10px}
  .pad-hint .big{font-size:44px;font-weight:900;color:var(--teal-d);min-width:64px;text-align:center}
  .pad-hint button{flex:0 0 56px;width:56px;min-width:0;margin:0;padding:10px 0;font-size:18px}
  canvas#pad{width:100%;height:min(58vh,340px);touch-action:none;border-radius:16px;background:#FFFDF8;
    border:2px dashed var(--teal-l);display:block}
  .pad-tools{display:flex;gap:10px;margin-top:10px}
  .pad-tools button{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;
    font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;color:var(--ink);box-shadow:var(--shadow)}

  /* ---------- rutinitas ---------- */
  .routine{display:flex;flex-direction:column;gap:12px}
  .rrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);
    background:#fff;border-radius:20px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);
    font-family:inherit;color:var(--ink);text-align:left;width:100%}
  .rrow:active{transform:scale(.985)}
  .rrow .ri{font-size:34px;line-height:1;width:46px;text-align:center}
  .rrow .rl{font-size:18px;font-weight:800;flex:1}
  .rrow .rc{width:38px;height:38px;flex:0 0 38px;border-radius:50%;
    border:2px dashed var(--teal-l);display:flex;align-items:center;justify-content:center;font-size:19px}
  .rrow.done{background:linear-gradient(120deg,#DFF1DC,#CDEBC9);border-color:var(--leaf)}
  .rrow.done .rc{background:var(--leaf);border-style:solid;border-color:var(--leaf)}
  .rrow.done .rl{text-decoration:line-through;opacity:.75}
  .bar{height:16px;border-radius:99px;background:#F0E7D9;overflow:hidden;margin:14px 0 6px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--teal-l));width:0;transition:width .4s}

  /* ---------- bintang ---------- */
  .starwrap{text-align:center;padding:8px 0 4px}
  .bigstar{font-size:72px;line-height:1}
  .starcount{font-size:clamp(44px,12vw,64px);font-weight:900;margin:6px 0 0;color:var(--coral-d)}
  .starwrap p{margin:6px 0 0;color:var(--ink-soft);font-size:15px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font-weight:800;opacity:0;
    transition:.3s;z-index:90;pointer-events:none;font-size:15px;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .fly{position:fixed;z-index:70;font-size:38px;pointer-events:none;transition:all .9s cubic-bezier(.2,.8,.2,1)}
  .conf{position:fixed;top:-40px;z-index:70;font-size:28px;pointer-events:none;animation:fall 1.9s linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(420deg);opacity:.15}}
  /* ---------- suasana tenang (menjelang tidur) ---------- */
  body.tenang{background:linear-gradient(180deg,#1B2340 0%,#272C4C 55%,#3A2F4A 100%);background-attachment:fixed}
  body.tenang header{background:rgba(18,22,42,.92);border-bottom-color:rgba(255,255,255,.08)}
  body.tenang header h1{color:#F6E7C6}
  body.tenang .ico-btn{background:rgba(255,255,255,.14);color:#F6E7C6}
  body.tenang .prog-note{color:#C9BEDA;opacity:.95}
  body.tenang footer{color:#A99DBE;opacity:.8}
  .cerita-kartu{background:#FFF8EE;border-radius:26px;padding:22px 18px;box-shadow:var(--shadow-lg);text-align:center}
  body.tenang .cerita-kartu{background:#2B3152;box-shadow:0 14px 34px rgba(0,0,0,.4)}
  .cerita-em{font-size:clamp(68px,23vw,104px);line-height:1.15}
  .cerita-teks{font-size:clamp(19px,5.2vw,24px);font-weight:800;line-height:1.5;margin-top:10px;color:var(--ink)}
  body.tenang .cerita-teks{color:#F6E7C6}
  .cerita-pil{display:flex;justify-content:center;align-items:center;gap:7px;margin:16px 0 4px}
  .cerita-pil i{display:block;width:9px;height:9px;border-radius:50%;background:rgba(51,38,26,.22)}
  .cerita-pil i.on{width:24px;border-radius:99px;background:var(--teal)}
  body.tenang .cerita-pil i{background:rgba(255,255,255,.22)}
  body.tenang .cerita-pil i.on{background:#F2C97D}
  .pilih-cerita{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
  .pilih-cerita button{border:none;border-radius:22px;padding:18px 8px;font-size:clamp(42px,14vw,60px);
    cursor:pointer;font-family:inherit;background:#fff;box-shadow:var(--shadow);min-height:100px}
  body.tenang .pilih-cerita button{background:#343B60}
  .pilih-cerita button.benar{background:linear-gradient(150deg,#CDEBC9,#A6DC9E)!important;animation:pulse .5s}
  .pilih-cerita button.coba{animation:shake .4s}
  .nama-sec{font-size:15px;font-weight:900;color:var(--teal-d);margin:18px 0 8px}
  body.tenang .nama-sec{color:#F2C97D}
  .nama-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .nama-grid button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:14px 6px;
    cursor:pointer;font-family:inherit;box-shadow:var(--shadow);display:flex;flex-direction:column;
    align-items:center;gap:6px;min-height:104px}
  .nama-grid button:active{transform:scale(.95)}
  .nama-grid .ne{font-size:36px;line-height:1}
  .nama-grid .nt{font-size:13.5px;font-weight:800;color:var(--ink);text-align:center;line-height:1.25}
  .nama-grid button.suara{background:linear-gradient(150deg,#FFE9B8,#F7CE7B);border-color:#F2B33D}
  .cerita-daftar{display:flex;flex-direction:column;gap:12px;margin-top:12px}
  .cerita-daftar button{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:#fff;
    border-radius:20px;padding:14px 16px;cursor:pointer;font-family:inherit;text-align:left;box-shadow:var(--shadow);width:100%}
  .cerita-daftar button:active{transform:scale(.985)}
  .cerita-daftar .ce{font-size:34px;line-height:1}
  .cerita-daftar .ct{display:block;font-weight:900;font-size:17px;color:var(--ink)}
  .cerita-daftar .cs{display:block;font-size:13px;color:var(--ink-soft);margin-top:2px}
  footer{text-align:center;font-size:12.5px;color:var(--ink-soft);padding:6px 12px 26px;line-height:1.6}
  .sec-title{font-size:15px;font-weight:900;color:var(--teal-d);margin:18px 0 8px}
  .safety{background:#FFFDF8;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:14px;line-height:1.6;color:var(--ink-soft)}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
    .fly,.conf{display:none!important}
  }
</style>
</head>
<body>
<header>
  <button class="ico-btn" id="btnBack" title="Kembali" aria-label="Kembali">←</button>
  <h1 id="ttl">Kebun Belajar</h1>
  <button class="ico-btn" id="btnHome" title="Beranda" aria-label="Beranda">🏡</button>
</header>
<main id="view"></main>
<footer>Kebun Belajar Al Fatih • dibuat dengan sayang • <span id="footnote">tanpa iklan, tanpa pelacak, bisa tanpa internet</span></footer>
<div id="overlay"></div>
<div id="modal"></div>

const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid = () => 'x' + Date.now().toString(36) + Math.floor(Math.random()*999).toString(36);
const LS = {

  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }

/* ---------- pembatalan timer saat berpindah halaman ---------- */
let TIMERS = [];
function later(fn, ms){ const id = setTimeout(() => { TIMERS = TIMERS.filter(t => t !== id); try { fn(); } catch (e) {} }, ms); TIMERS.push(id); return id; }
let EVT_HANDLERS = [];
function onWindow(evt, fn){ window.addEventListener(evt, fn); EVT_HANDLERS.push([evt, fn]); }
function cleanFx(){
  try { document.querySelectorAll('.conf,.fly').forEach(e => e.remove()); } catch (e) {}
}
function clearTimers(){
  TIMERS.forEach(clearTimeout); TIMERS = [];
  EVT_HANDLERS.forEach(h => { try { window.removeEventListener(h[0], h[1]); } catch (e) {} });
  EVT_HANDLERS = [];
}

const DEF_SET = { level:1, mute:false, vol:1, breakMin:10, sessionLen:5, cariN:3 };
const S = {
  name:     () => LS.get('af_name', 'Al Fatih'),
  routines: () => { const r = LS.get('af_routines', DEF_ROUTINES); return Array.isArray(r) && r.length ? r : DEF_ROUTINES; },
  rewards:  () => { const r = LS.get('af_rewards', DEF_REWARDS); return Array.isArray(r) ? r : DEF_REWARDS.slice(); },
  target:   () => { const n = Number(LS.get('af_target', 10)); return (isFinite(n) && n >= 1) ? Math.min(500, Math.floor(n)) : 10; },
  stars:    () => { const n = LS.get('af_stars', 0); return (isFinite(n) && n > 0) ? Math.floor(n) : 0; },
  setStars: (n) => LS.set('af_stars', Math.max(0, Math.floor(n || 0))),
  addStars: (n) => { const v = Math.max(0, S.stars() + (n || 0)); LS.set('af_stars', v); S.logStar(n || 0); return v; },
  today:    () => { const t = LS.get('af_today', { d:'', done:[] }); return (t && t.d === todayKey() && Array.isArray(t.done)) ? t : { d: todayKey(), done: [] }; },
  saveToday:(t) => LS.set('af_today', t),
  history:  () => { const h = LS.get('af_history', []); return Array.isArray(h) ? h : []; },
  logStar(n){ const h = S.history(); const t = todayKey(); let e = h.find(x => x.d === t); if (!e) { e = { d:t, n:0 }; h.push(e); } e.n += n; LS.set('af_history', h); },
  growth:   () => { const g = LS.get('af_growth', []); return Array.isArray(g) ? g : []; },
  saveGrowth:(g) => LS.set('af_growth', g),
  prev:     () => { const p = LS.get('af_lastReward', null); return (p && typeof p === 'object') ? p : null; },
  lastRewardAt: () => { const p = S.prev(); return p ? String(p.t || '') : ''; },
  set:      () => { const s = LS.get('af_set', null); return Object.assign({}, DEF_SET, (s && typeof s === 'object') ? s : {}); },
  saveSet:  (s) => { LS.set('af_set', Object.assign({}, DEF_SET, s || {})); },
  prog:     () => { const p = LS.get('af_progress', null); return (p && typeof p === 'object') ? p : {}; },
  saveProg: (p) => LS.set('af_progress', p),
  record(skill, ok){
    const p = S.prog();
    const e = p[skill] && typeof p[skill] === 'object' ? p[skill] : { attempts:0, correct:0 };
    e.attempts = (Number(e.attempts) || 0) + 1;
    if (ok) e.correct = (Number(e.correct) || 0) + 1;
    p[skill] = e; S.saveProg(p); return e;
  },
  kuis(){
    const k = LS.get('af_kuis', null);
    if (k && typeof k === 'object') return { total: Number(k.total)||0, benar: Number(k.benar)||0 };

/* batas materi sesuai tingkat (usia 3 = tingkat 1, pilihan paling sedikit) */
function LIMITS(){
  const lv = Number(S.set().level) || 1;
  return {
    letters:  lv <= 1 ? 5 : lv === 2 ? 10 : 26,
    numbers:  lv <= 1 ? 5 : lv === 2 ? 10 : 20,
    hijaiyah: lv <= 1 ? 5 : lv === 2 ? 10 : 28
  };
}

/* ---------- audio: MP3 tersimpan + fallback suara perangkat ---------- */
const AUD = { ready:false, base:'audio/', el:null, files:[] };
let VOICES = [];
function loadVoices(){ try { VOICES = window.speechSynthesis.getVoices() || []; } catch (e) { VOICES = []; } }
if (window.speechSynthesis) { loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; later(loadVoices, 500); }
function pickVoice(prefix){
  const list = VOICES.length ? VOICES : (window.speechSynthesis ? window.speechSynthesis.getVoices() : []);
  return list.find(v => (v.lang||'').toLowerCase().replace('_','-').startsWith(prefix))
      || list.find(v => (v.lang||'').toLowerCase().startsWith(prefix.slice(0,2))) || null;
}
function tts(text, lang, rate){
  if (!window.speechSynthesis || !text) return;
  if (S.set().mute) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang || 'id-ID';
    const v = pickVoice(u.lang); if (v) u.voice = v;
    u.rate = rate || 0.85; u.pitch = 1.12; u.volume = volume();
    window.speechSynthesis.speak(u);
  } catch (e) {}
}
function volume(){ const v = Number(S.set().vol); return isFinite(v) ? Math.max(0, Math.min(1, v)) : 1; }
let AUDIO_MANIFEST_OK = false;
function initAudio(){
  try {
    fetch('audio/manifest.json', { cache:'no-store' })
      .then(r => { if (!r.ok) throw 0; return r.json(); })
      .then(j => {
        AUD.files = Array.isArray(j && j.files) ? j.files : [];
        AUD.ready = AUD.files.length > 0; AUDIO_MANIFEST_OK = true;
        // Versi kumpulan suara: beri tahu bila ada pembaruan, dan simpan di cache.
        const ver = String((j && j.version) || AUD.files.length);
        const prev = LS.get('af_audio_ver', null);
        if (AUD.ready && prev !== ver) {
          LS.set('af_audio_ver', ver);
          if (prev !== null) toast('Suara aplikasi diperbarui (' + AUD.files.length + ' berkas)');
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            try { navigator.serviceWorker.controller.postMessage('cache-audio'); } catch (e) {}
          }
        }
      })
      .catch(() => { AUD.ready = false; AUDIO_MANIFEST_OK = false; });
  } catch (e) { AUD.ready = false; }
}
initAudio();
function say(file, fallbackText, fallbackLang, rate){
  if (S.set().mute) { return; }
  const fb = () => { if (fallbackText) tts(fallbackText, fallbackLang || 'id-ID', rate); };
  if (!AUD.ready) { fb(); return; }
  try {
    if (AUD.el) { try { AUD.el.pause(); } catch (e) {} AUD.el = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    const a = new Audio(AUD.base + file);
    a.volume = volume();
    AUD.el = a;
    let done = false;
    const fail = () => { if (done) return; done = true; fb(); };
    a.addEventListener('error', fail);
    const pr = a.play();
    if (pr && pr.catch) pr.catch(fail);
    later(() => { if (!done && a.paused && a.currentTime === 0) fail(); }, 900);
  } catch (e) { fb(); }
}
function stopAudio(){
  if (AUD.el) { try { AUD.el.pause(); } catch (e) {} AUD.el = null; }
  if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
}

/* ---------- suara efek ---------- */
let AC = null;
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function tone(f, delay, dur, gain, type){
  if (S.set().mute) return;
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime((gain || 0.14) * volume(), t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.18));
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + (dur||0.18) + 0.05);
}
function chime(){ tone(784,0,.16); tone(1046,.11,.18); tone(1568,.22,.3); }
function pop(){ tone(520,0,.09,.1,'triangle'); }
function buzz(){ tone(200,0,.18,.12,'sawtooth'); tone(150,.16,.22,.12,'sawtooth'); }
function fanfare(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f, i*.11, .3, .16)); }

/* ---------- efek ---------- */
function toast(msg){ const t = $('#toast'); if (!t) return; t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2100); }
function flyStar(fromEl){
  if (REDUCE_MOTION) return;
  try {
    const r = fromEl ? fromEl.getBoundingClientRect() : { left:innerWidth/2, top:innerHeight/2, width:0, height:0 };
    const s = document.createElement('div'); s.className = 'fly'; s.textContent = '⭐';
    s.style.left = (r.left + r.width/2) + 'px'; s.style.top = (r.top + r.height/2) + 'px';
    document.body.appendChild(s);
    requestAnimationFrame(()=>{ s.style.transform = 'translate(-50%,-50%) scale(1.4)'; });
    setTimeout(()=>{ s.style.left = (innerWidth/2)+'px'; s.style.top = '70px';
      s.style.transform = 'translate(-50%,-50%) scale(.3)'; s.style.opacity = '.2'; }, 30);
    setTimeout(()=>s.remove(), 1000);
  } catch (e) {}
}
function confetti(){
  if (REDUCE_MOTION) return;
  const em = ['⭐','🎉','✨','🌟','🎈','💚','🤗'];
  for (let i = 0; i < 24; i++) {
    const d = document.createElement('div'); d.className = 'conf'; d.textContent = em[i % em.length];
    d.style.left = (Math.random()*94 + 2) + 'vw';
    d.style.animationDelay = (Math.random()*0.6) + 's';
    d.style.fontSize = (22 + Math.random()*22) + 'px';
    document.body.appendChild(d); setTimeout(()=>d.remove(), 2800);
  }
}

/* ---------- kerangka tampilan ---------- */
let stack = [];
function setTitle(t){ const el = $('#ttl'); if (el) el.textContent = t; }
function render(name, push){
  clearTimers(); stopAudio(); cleanFx();
  modeTenang(name === 'cerita');
  if (push !== false) { if (stack[stack.length-1] !== name) stack.push(name); }
  const v = $('#view'); if (!v) return; v.innerHTML = '';
  (VIEWS[name] || VIEWS.home)(v);
  window.scrollTo(0,0);
}
function goHome(){ stack = []; render('home', true); }
$('#btnHome').onclick = goHome;
$('#btnBack').onclick = () => {
  if ($('#overlay').classList.contains('on')) { closeOverlay(); return; }
  if ($('#modal').classList.contains('on')) { closeModal(); return; }
  stopAudio();
  if (stack.length > 1) { stack.pop(); const prev = stack[stack.length-1]; stack.pop(); render(prev, true); }
  else goHome();
};
function openOverlay(html, bg, color){
  const o = $('#overlay'); o.innerHTML = '';
  const c = document.createElement('div'); c.className = 'card';
  if (bg) c.style.background = bg;
  if (color) c.style.color = color;
  c.innerHTML = html; o.appendChild(c); o.classList.add('on'); return c;
}
function closeOverlay(){ const o = $('#overlay'); o.classList.remove('on'); o.innerHTML = ''; stopAudio(); }
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeOverlay(); });
function openModal(html){ const m = $('#modal'); m.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + '</div>'; m.classList.add('on'); }
function closeModal(){ const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
window.closeModal = closeModal;
window.appClosePanel = () => { closeModal(); render(stack[stack.length-1] || 'home', false); };

const MEM = { first:null, lock:false, pairs:4, found:0 };
VIEWS.cocok = (v) => {
  setTitle('Cocokkan Kartu');
  const p = document.createElement('p'); p.className = 'prog-note';
  p.textContent = 'Buka dua kartu. Kalau gambarnya sama, kartunya terbuka. Cari semua pasangan!';
  v.appendChild(p);
  MEM.first = null; MEM.lock = false; MEM.found = 0;
  MEM.pairs = 4;
  const items = SHAPES.slice().sort(() => Math.random()-0.5).slice(0, MEM.pairs);
  const deck = items.concat(items).sort(() => Math.random()-0.5);
  const board = document.createElement('div'); board.className = 'board'; board.id = 'board';
  deck.forEach((it, idx) => {
    const b = document.createElement('button'); b.className = 'mcard'; b.dataset.k = it.id;
    b.textContent = it.em; b._sym = it;
    b.onclick = () => flip(b);
    board.appendChild(b);
  });
  v.appendChild(board);
  const rest = document.createElement('button'); rest.className = 'btn ghost sm'; rest.textContent = '🔁 Bagikan ulang';
  rest.onclick = () => render('cocok', false);
  v.appendChild(rest);
};
function flip(b){
  if (MEM.lock || b.classList.contains('open') || b.classList.contains('matched')) return;
  b.classList.add('open'); pop();
  say(null, b._sym.nm);
  if (!MEM.first) { MEM.first = b; return; }
  if (MEM.first === b) return;
  const a = MEM.first; MEM.first = null;
  if (a.dataset.k === b.dataset.k) {
    a.classList.add('matched'); b.classList.add('matched');
    S.record('cocok', true); MEM.found++;
    chime();
    if (MEM.found === MEM.pairs) { S.addStars(1); confetti(); fanfare(); toast('Semua ketemu! +1 ⭐'); }
  } else {
    MEM.lock = true; buzz();
    later(() => { a.classList.remove('open'); b.classList.remove('open'); MEM.lock = false; }, 800);
  }
}

/* ================= MENGGAMBAR & LATIHAN (canvas, POINTER) ================= */
VIEWS.gambar = (v) => {
  setTitle('Menggambar & Latihan');
  const p = document.createElement('p'); p.className = 'prog-note';
  p.textContent = 'Coret bebas atau jiplak huruf. Ini hanya latihan bermain — bukan penilaian tulisan.';
  v.appendChild(p);

  const lim = LIMITS();
  const pick = LETTERS.slice(0, lim.letters);
  const M = { i:0 };
  const wrap = document.createElement('div'); wrap.className = 'pad-wrap';
  const hint = document.createElement('div'); hint.className = 'pad-hint';
  hint.innerHTML = '<button class="btn ghost" id="padPrev" aria-label="Huruf sebelumnya">←</button>' +
    '<span class="big" id="padLetter">' + esc(pick[0][0]) + '</span>' +
    '<button class="btn ghost" id="padNext" aria-label="Huruf berikutnya">→</button>';
  wrap.appendChild(hint);
  const cv = document.createElement('canvas'); cv.id = 'pad';
  const ghost = document.createElement('div'); ghost.style.cssText = 'position:relative';
  ghost.appendChild(cv);
  const under = document.createElement('div'); under.id = 'padUnder';
  under.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;color:#F0E7D9;pointer-events:none';
  under.textContent = pick[0][0];
  ghost.appendChild(under);
  wrap.appendChild(ghost);
  const tools = document.createElement('div'); tools.className = 'pad-tools';
  tools.innerHTML = '<button id="padClear">🧽 Bersihkan</button><button id="padNew">🎲 Gambar bebas</button>';
  wrap.appendChild(tools);
  v.appendChild(wrap);

  const ctx = cv.getContext('2d');
  function fit(){
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const img = cv.width ? ctx.getImageData(0,0,cv.width,cv.height) : null;
    cv.width = Math.max(1, Math.round(r.width * dpr));
    cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14857A';
    if (img) { try { ctx.putImageData(img, 0, 0); } catch (e) {} }
  }
  later(fit, 30);
  onWindow('resize', fit);

  let drawing = false, lastPt = null;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); drawing = true; lastPt = pos(e); try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
  cv.addEventListener('pointermove', (e) => {
    if (!drawing) return; e.preventDefault();
    const p2 = pos(e);
    ctx.beginPath(); ctx.moveTo(lastPt.x, lastPt.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    lastPt = p2;
  });
  const end = (e) => { if (!drawing) return; drawing = false; lastPt = null; S.record('gambar', true); };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('pointerleave', end);

  $('#padClear', wrap).onclick = () => { ctx.clearRect(0,0,cv.width,cv.height); toast('Papan dibersihkan'); };
  $('#padNew', wrap).onclick = () => { ctx.clearRect(0,0,cv.width,cv.height); under.textContent = ''; toast('Gambar bebas'); };
  $('#padPrev', wrap).onclick = () => { M.i = (M.i - 1 + pick.length) % pick.length; setPad(M.i); };
  $('#padNext', wrap).onclick = () => { M.i = (M.i + 1) % pick.length; setPad(M.i); };
  function setPad(i){ ctx.clearRect(0,0,cv.width,cv.height); under.textContent = pick[i][0]; $('#padLetter', wrap).textContent = pick[i][0]; say(A.letter(i), pick[i][0], 'id-ID', 0.8); }
  say(A.letter(0), pick[0][0], 'id-ID', 0.8);
};

/* ================= SESI BELAJAR SINGKAT ================= */
const SES = { steps:[], i:0, correct:0, attempts:0, doneFlag:false };
function shuffle(a){ const x = a.slice(); for (let i = x.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); const t = x[i]; x[i] = x[j]; x[j] = t; } return x; }
function startSession(){
  const lim = LIMITS();
  const steps = [];
  steps.push({ kind:'intro' });
  // 1) kenali satu huruf
  const hi = Math.floor(Math.random()*lim.letters);
  steps.push({ kind:'letter', i:hi });
  // 2) kenali satu angka
  const hn = 1 + Math.floor(Math.random()*lim.numbers);
  steps.push({ kind:'number', n:hn });
  // 3) berhitung sentuh (3-5 gambar)
  steps.push({ kind:'count', n: Math.max(3, Math.min(lim.numbers, 4)) });
  // 4) tebak-tebakan kecil (1 soal)
  steps.push({ kind:'quiz', cat: (Math.random() < .5 ? 'huruf' : 'angka') });
  steps.push({ kind:'outro' });
  SES.steps = steps; SES.i = 0; SES.correct = 0; SES.attempts = 0; SES.doneFlag = false;
  ph('sesiIntro');
  later(() => render('sesi', true), 500);
}
VIEWS.sesi = (v) => {
  setTitle('Sesi Belajar');
  const step = SES.steps[SES.i];
  if (!step) { finishSession(v); return; }
  const top = document.createElement('div'); top.className = 'kuis-top';
  const pct = Math.round((SES.i) / Math.max(1, SES.steps.length-1) * 100);
  top.innerHTML = '<span class="pill">Langkah ' + (SES.i+1) + '/' + SES.steps.length + '</span>' +
                  '<span class="pill">✅ ' + SES.correct + '</span>' +
                  '<span class="pill">⭐ ' + S.stars() + '</span>';
  v.appendChild(top);
  const bar = document.createElement('div'); bar.className = 'bar'; bar.innerHTML = '<i style="width:' + pct + '%"></i>';
  v.appendChild(bar);

  const next = () => { SES.i++; render('sesi', false); };
  const skip = () => { stopAudio(); goHome(); };

  if (step.kind === 'intro') {
    const c = document.createElement('div'); c.className = 'kuis-q';
    c.innerHTML = '<div style="font-size:60px">' + mascot(64) + '</div>' +
      '<div class="qq">Ayo mulai, ' + esc(S.name()) + '!</div>' +
      '<div class="qh">Kita belajar sedikit-sedikit. Kalau sudah lelah, tekan "Cukup dulu".</div>';
    v.appendChild(c);
    const b = document.createElement('button'); b.className = 'btn green'; b.textContent = '▶️ Mulai'; b.onclick = next;
    v.appendChild(b);
  } else if (step.kind === 'letter') {
    const L = LETTERS[step.i];
    const opts = shuffle([step.i].concat(cardDistract(step.i, LIMITS().letters, 3)));
    const c = document.createElement('div'); c.className = 'kuis-q';
    c.innerHTML = '<div class="qq" id="sq">Mana huruf ' + esc(L[0]) + '?</div><div class="qh" id="sh">dengarkan lalu sentuh hurufnya</div>';
    v.appendChild(c);
    const box = document.createElement('div'); box.className = 'opts';
    opts.forEach((o, idx) => {
      const b = document.createElement('button'); b.className = 'opt c' + (idx%6+1); b.textContent = LETTERS[o][0];
      b.onclick = () => sessAnswer(b, o === step.i, 'huruf', () => say(A.letter(step.i), L[0], 'id-ID', 0.8), next);
      box.appendChild(b);
    });
    v.appendChild(box);
    later(() => say(A.letter(step.i), L[0], 'id-ID', 0.8), 250);
  } else if (step.kind === 'number') {
    const n = step.n;
    const opts = shuffle([n].concat(numDistract(n, LIMITS().numbers, 3)));
    const c = document.createElement('div'); c.className = 'kuis-q';
    c.innerHTML = '<div class="qq">Mana angka ' + n + '?</div><div class="qh">sentuh angka yang benar</div>';
    v.appendChild(c);
    const box = document.createElement('div'); box.className = 'opts';
    opts.forEach((o, idx) => {
      const b = document.createElement('button'); b.className = 'opt c' + (idx%6+1); b.textContent = o;
      b.onclick = () => sessAnswer(b, o === n, 'angka', () => say(A.number(n), ANGKA_KATA[n], 'id-ID', 0.75), next);
      box.appendChild(b);
    });
    v.appendChild(box);
    later(() => say(A.number(n), ANGKA_KATA[n], 'id-ID', 0.75), 250);
  } else if (step.kind === 'count') {
    const n = step.n;
    const em = COUNT_EMOJI[Math.floor(Math.random()*COUNT_EMOJI.length)];
    const c = document.createElement('div'); c.className = 'kuis-q';
    c.innerHTML = '<div class="qq">Berapa banyak gambarnya?</div><div class="qh">hitung: sentuh satu-satu</div>';
    v.appendChild(c);
    const area = document.createElement('div'); area.className = 'tap-area'; area.id = 'tapArea';
    let tapped = 0;
    for (let i = 0; i < n; i++) {
      const b = document.createElement('button'); b.className = 'tap-obj'; b.textContent = em;
      b.onclick = () => { if (b.classList.contains('tapped')) return; b.classList.add('tapped'); tapped++; pop();
        const cc = $('#sCount'); if (cc) cc.textContent = 'Hitung: ' + tapped;
        if (tapped === n) { S.record('hitung', true); S.addStars(1); chime(); flyStar(area); toast('Hitung ' + n + ' — hebat! +1 ⭐');
          const nb = document.createElement('button'); nb.className = 'btn green'; nb.textContent = 'Lanjut ▶️'; nb.onclick = next; v.appendChild(nb); }
      };
      area.appendChild(b);
    }
    v.appendChild(area);
    const cc = document.createElement('p'); cc.className = 'tap-count'; cc.id = 'sCount'; cc.textContent = 'Hitung: 0';
    v.appendChild(cc);
  } else if (step.kind === 'quiz') {
    const lim = LIMITS();
    let target, pool, render2;
    if (step.cat === 'huruf') {
      target = Math.floor(Math.random()*lim.letters);
      pool = cardDistract(target, lim.letters, 3);
      render2 = (o) => LETTERS[o][0];
    } else {
      target = 1 + Math.floor(Math.random()*lim.numbers);
      pool = numDistract(target, lim.numbers, 3);
      render2 = (o) => o;
    }
    const opts = shuffle([target].concat(pool));
    const c = document.createElement('div'); c.className = 'kuis-q';
    c.innerHTML = '<div class="qq">Tebak: mana ' + esc(step.cat === 'huruf' ? 'huruf ' + LETTERS[target][0] : 'angka ' + target) + '?</div>' +
      '<div class="qh">dengarkan lalu sentuh jawabannya</div>';
    v.appendChild(c);
    const box = document.createElement('div'); box.className = 'opts';
    opts.forEach((o, idx) => {
      const b = document.createElement('button'); b.className = 'opt c' + (idx%6+1); b.textContent = render2(o);
      b.onclick = () => sessAnswer(b, o === target, step.cat,
        () => say(step.cat === 'huruf' ? A.letter(target) : A.number(target),
          step.cat === 'huruf' ? LETTERS[target][0] : ANGKA_KATA[target], 'id-ID', 0.8), next);
      box.appendChild(b);
    });
    v.appendChild(box);
    later(() => {
      if (step.cat === 'huruf') say(A.letter(target), 'Mana huruf ' + LETTERS[target][0] + '?', 'id-ID', 0.8);
      else say(A.number(target), 'Mana angka ' + target + '?', 'id-ID', 0.75);
    }, 250);
  } else {
    const c = document.createElement('div'); c.className = 'kuis-q';
    c.innerHTML = '<div class="qq">Yaaay! 🎉</div><div class="qh">Sesi selesai. Terima kasih sudah belajar, ' + esc(S.name()) + '.</div>';
    v.appendChild(c);
    const b = document.createElement('button'); b.className = 'btn'; b.textContent = '🏡 Selesai'; b.onclick = next;
    v.appendChild(b);
  }

  const stop = document.createElement('button');
  stop.className = 'btn ghost sm'; stop.textContent = '⏸️ Cukup dulu';
  stop.onclick = skip;
  v.appendChild(stop);
};
function cardDistract(i, lim, k){
  const out = [];
  while (out.length < k) { const c = Math.floor(Math.random()*lim); if (c !== i && out.indexOf(c) < 0) out.push(c); }
  return out;
}
function numDistract(n, lim, k){
  const out = [];
  while (out.length < k) { const c = 1 + Math.floor(Math.random()*lim); if (c !== n && out.indexOf(c) < 0) out.push(c); }
  return out;
}
function sessAnswer(btn, ok, skill, sayAgain, next){
  SES.attempts++;
  if (ok) {
    btn.classList.add('right'); SES.correct++;
    S.record(skill, true); S.addStars(1);
    chime(); flyStar(btn); ph('benar');
    toast('Benar! +1 ⭐');
    later(next, 1200);
  } else {
    btn.classList.add('wrong'); buzz(); ph('cobaLagi');
    S.record(skill, false);
    later(() => btn.classList.remove('wrong'), 500);
    sayAgain();
  }
}
function finishSession(v){
  stopAudio();
  const p = document.createElement('div'); p.className = 'starwrap';
  p.innerHTML = '<div class="bigstar">' + (SES.correct >= 2 ? '🏆' : '🌱') + '</div>' +
    '<div class="starcount">' + SES.correct + ' benar</div>' +
    '<p>Sesi selesai. Bintangmu sekarang ' + S.stars() + ' ⭐</p>';
  v.appendChild(p);
  ph('sesiSelesai');
  const w = document.createElement('p'); w.className = 'prog-note';
  w.textContent = 'Istirahat dulu kalau sudah lelah ya. Sesi singkat lebih baik daripada lama-lama.';
  v.appendChild(w);
  const again = document.createElement('button'); again.className = 'btn'; again.textContent = '🔁 Sesi lagi';
  again.onclick = () => startSession();
  v.appendChild(again);
  const home = document.createElement('button'); home.className = 'btn ghost sm'; home.textContent = '🏡 Kembali';
  home.onclick = goHome; v.appendChild(home);
}

function kuisButton(cat){
  const b = document.createElement('button');
  b.className = 'btn green';
  b.textContent = '🧠 Coba tebak-tebakan';
  b.onclick = () => { pop(); ph('kuisIntro'); startQuiz(cat); };

}
const K = { cat:'huruf', i:0, total:5, benar:0, target:null, opts:[], locked:false };
VIEWS.kuis = (v) => {
  setTitle('Belajar Sendiri');
  const lim = LIMITS();
  const p = document.createElement('p'); p.className = 'prog-note';
  p.textContent = 'Aplikasi menyebut satu huruf/angka, anak memilih yang benar. Setiap jawaban benar dapat 1 bintang.';
  v.appendChild(p);
  const cats = [['huruf','Tebak Huruf 🔤'],['angka','Tebak Angka 🔢']];
  if (lim.hijaiyah > 5) cats.push(['hijaiyah','Tebak Hijaiyah 🕌']);
  cats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = c[1];
    b.onclick = () => { pop(); startQuiz(c[0]); };
    v.appendChild(b);
  });
  const kk = S.kuis();
  const kv = document.createElement('div'); kv.className = 'kv';
  kv.innerHTML = '<div><b>' + kk.total + '</b><span>soal dikerjakan</span></div>' +
                 '<div><b>' + kk.benar + '</b><span>jawaban benar</span></div>';
  v.appendChild(kv);
};
function startQuiz(cat){
  K.cat = cat || 'huruf'; K.i = 0; K.benar = 0; K.total = 5; K.locked = false;
  render('kuisjalan');
}
function kuisPool(){
  const lim = LIMITS();
  if (K.cat === 'huruf') return lim.letters;
  if (K.cat === 'hijaiyah') return lim.hijaiyah;
  return lim.numbers;
}
VIEWS.kuisjalan = (v) => {
  setTitle('Belajar Sendiri');
  const top = document.createElement('div'); top.className = 'kuis-top';
  top.innerHTML = '<span class="pill">Soal ' + (K.i+1) + '/' + K.total + '</span>' +
                  '<span class="pill">✅ ' + K.benar + '</span>';
  v.appendChild(top);
  const q = document.createElement('div'); q.className = 'kuis-q';
  q.innerHTML = '<div class="qq" id="qtext">Dengarkan…</div>' +
                '<div class="qh" id="qhint">sentuh tombol ulangi untuk mendengar lagi</div>';
  v.appendChild(q);
  const opts = document.createElement('div'); opts.className = 'opts'; opts.id = 'opts';
  v.appendChild(opts);
  const rep = document.createElement('button');
  rep.className = 'btn ghost sm'; rep.textContent = '🔊 Ulangi pertanyaan';
  rep.onclick = askAgain;
  v.appendChild(rep);
  const stop = document.createElement('button');
  stop.className = 'btn ghost sm'; stop.textContent = '⏸️ Selesai bermain';
  stop.onclick = () => { stopAudio(); goHome(); };
  v.appendChild(stop);
  newQuestion();
};
function newQuestion(){
  const box = $('#opts'); if (!box) return;
  K.locked = false;
  const pool = kuisPool();
  K.target = Math.floor(Math.random() * pool);
  const opts = [K.target];
  let guard = 0;
  while (opts.length < Math.min(4, pool) && guard++ < 200) { const c = Math.floor(Math.random() * pool); if (opts.indexOf(c) < 0) opts.push(c); }
  K.opts = shuffle(opts);

  const qt = $('#qtext'), qh = $('#qhint');
  if (K.cat === 'huruf')      { qt.textContent = 'Mana huruf ' + LETTERS[K.target][0] + '?'; qh.textContent = 'dengarkan lalu sentuh hurufnya'; }
  else if (K.cat === 'angka') { qt.textContent = 'Mana angka ' + (K.target + 1) + '?';      qh.textContent = 'dengarkan lalu sentuh angkanya'; }
  else                        { qt.textContent = 'Mana huruf ' + HIJAIYAH[K.target][1] + '?'; qh.textContent = 'dengarkan lalu sentuh hurufnya'; }

  box.innerHTML = '';
  K.opts.forEach((o, idx) => {
    const b = document.createElement('button');
    b.className = 'opt c' + ((idx % 6) + 1);
    b.textContent = K.cat === 'huruf' ? LETTERS[o][0] : K.cat === 'angka' ? (o + 1) : HIJAIYAH[o][0];
    if (K.cat === 'hijaiyah') b.style.fontSize = 'clamp(38px,12vw,64px)';
    b.onclick = () => answer(o, b);
    box.appendChild(b);
  });
  later(askAgain, 250);
}
function askAgain(){
  if (K.cat === 'huruf')      say(A.letter(K.target), 'Mana huruf ' + LETTERS[K.target][0] + '?', 'id-ID', 0.8);
  else if (K.cat === 'angka') say(A.number(K.target + 1), 'Mana angka ' + (K.target + 1) + '?', 'id-ID', 0.75);
  else                        say(A.hij(K.target), 'Mana huruf ' + HIJAIYAH[K.target][1] + '?', 'ar-SA', 0.75);
}
function answer(o, btn){
  if (K.locked) return;
  if (o === K.target) {
    K.locked = true; K.benar++;
    btn.classList.add('right');
    chime(); flyStar(btn); S.addStars(1);
    S.record(K.cat, true);
    const kk = S.kuis(); kk.total++; kk.benar++; S.saveKuis(kk);
    if (K.benar === 3) { confetti(); fanfare(); ph('alhamdulillah'); }
    else ph('benar');
    toast('Benar! +1 ⭐');
    later(() => {
      K.i++;
      if (K.i >= K.total) { showResult(); return; }
      render('kuisjalan', false);
    }, 1400);
  } else {
    btn.classList.add('wrong');
    buzz(); ph('cobaLagi');
    S.record(K.cat, false);
    const kk = S.kuis(); kk.total++; S.saveKuis(kk);
    later(() => btn.classList.remove('wrong'), 500);
  }
}
function showResult(){
  clearTimers(); stopAudio();
  const v = $('#view'); if (!v) return;
  setTitle('Hasil Bermain');
  v.innerHTML = '';
  const w = document.createElement('div'); w.className = 'starwrap';
  w.innerHTML = '<div class="bigstar">' + (K.benar >= 4 ? '🏆' : K.benar >= 2 ? '⭐' : '💪') + '</div>' +
    '<div class="starcount">' + K.benar + '/' + K.total + '</div>' +
    '<p>' + (K.benar >= 4 ? 'Pintar sekali!' : K.benar >= 2 ? 'Bagus! Ayo coba lagi.' : 'Semangat, ayo coba lagi!') + '</p>';
  v.appendChild(w);
  if (K.benar >= 4) { confetti(); fanfare(); }
  ph('kuisSelesai');
  const again = document.createElement('button');
  again.className = 'btn'; again.textContent = '🔁 Main lagi';
  again.onclick = () => startQuiz(K.cat);
  v.appendChild(again);
  const home = document.createElement('button');
  home.className = 'btn ghost sm'; home.textContent = '🏡 Kembali ke beranda';
  home.onclick = goHome;
  v.appendChild(home);
}

/* ================= KUNCI & PANEL ORANG TUA ================= */
function parentGate(){
  const a = 6 + Math.floor(Math.random()*6), b = 7 + Math.floor(Math.random()*6);
  openModal('<h2>Kunci untuk Ayah/Ibu 🔒</h2><p class="hint">Jawab soal ini supaya anak tidak masuk ke pengaturan.</p>' +
    '<div class="field"><input type="number" id="gateAns" placeholder="' + a + ' + ' + b + ' = ?" autocomplete="off" inputmode="numeric">' +
    '<button id="gateGo" class="ok">Buka</button></div>' +
    '<button class="btn ghost sm" onclick="closeModal()">Batal</button>');
  const go = () => {
    if (Number($('#gateAns').value) === a + b) { closeModal(); parentPanel('umum'); }
    else { toast('Jawaban belum tepat'); $('#gateAns').value = ''; }
  };
  $('#gateGo').onclick = go;
  $('#gateAns').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  later(()=>{ const el = $('#gateAns'); if (el) el.focus(); }, 120);
}

function parentPanel(tab){
  tab = tab || 'umum';
  openModal('<h2>Pengaturan Ayah/Ibu ⚙️</h2><p class="hint">Semua perubahan langsung tersimpan di perangkat ini.</p>' +
    '<div class="tabs" id="pTabs">' +
      '<button data-t="umum">Umum</button>' +
      '<button data-t="progres">Progres</button>' +

  const rows = Object.keys(names).map(k => {
    const e = p[k]; if (!e || !e.attempts) return '';
    const acc = Math.round((e.correct / e.attempts) * 100);
    return '<div class="rowline"><span class="em">📊</span><span class="tx">' + esc(names[k]) +
      '<div class="sm">' + e.correct + ' benar dari ' + e.attempts + ' percobaan</div></span>' +
      '<span class="sm">' + acc + '%</span></div>';
  }).filter(Boolean).join('');

  box.innerHTML = '<h3>Progres per keterampilan</h3>' +
    (rows || '<p class="prog-note">Belum ada percobaan tercatat. Progres muncul setelah anak mencoba kegiatan.</p>') +

function pTabKegiatan(box){

    '<input type="text" id="pNewTx" placeholder="Kegiatan baru…" maxlength="60">' +
    '<button id="pAddR" class="ok">+</button></div>';
  const draw = () => {
    const b = $('#pRoutines'); b.innerHTML = '';
    S.routines().forEach((r, i) => {
      const d = document.createElement('div'); d.className = 'rowline';
      d.innerHTML = '<span class="em">' + esc(r.em) + '</span><span class="tx">' + esc(r.tx) + '</span>' +
        '<button data-i="' + i + '" data-a="up">↑</button><button data-i="' + i + '" data-a="del">Hapus</button>';
      b.appendChild(d);
    });
  };
  draw();
  $('#pRoutines').onclick = (e) => {
    const i = Number(e.target.getAttribute && e.target.getAttribute('data-i'));
    const a = e.target.getAttribute && e.target.getAttribute('data-a');
    if (isNaN(i) || !a) return;
    const arr = S.routines();
    if (a === 'del') arr.splice(i, 1);
    if (a === 'up' && i > 0) { const t = arr[i-1]; arr[i-1] = arr[i]; arr[i] = t; }

    const arr = S.routines(); arr.push({ id:'r' + Date.now(), em: em, tx: tx }); LS.set('af_routines', arr);
    $('#pNewTx').value = ''; draw(); toast('Kegiatan ditambah');
  };

function pTabTumbuh(box){
  const g = S.growth().slice().sort((a,b) => (a.d < b.d ? -1 : 1));
  const last = g[g.length - 1] || null;
  const first = g[0] || null;
  const gainCm = (last && first && last.cm && first.cm) ? (last.cm - first.cm) : null;

  let chart = '';
  const withKg = g.filter(x => x.kg).slice(-8);
  if (withKg.length) {
    const mx = Math.max.apply(null, withKg.map(x => x.kg));
    const mn = Math.min.apply(null, withKg.map(x => x.kg));
    const span = Math.max(0.5, mx - mn);
    chart = '<div style="display:flex;align-items:flex-end;gap:6px;height:168px;margin-top:12px;background:#FBF5EA;border:1px solid var(--line);border-radius:14px;padding:10px">' +
      withKg.map(x => {
        const h = Math.round(((x.kg - mn) / span) * 96) + 20;
        return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0">' +
          '<em style="font-size:10.5px;font-style:normal;color:var(--ink-soft)">' + esc(String(x.kg)) + '</em>' +
          '<i style="display:block;width:100%;height:' + h + 'px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#F2B33D,#E89B24)"></i>' +
          '<em style="font-size:10.5px;font-style:normal;color:var(--ink-soft);white-space:nowrap">' + esc(String(x.d).slice(5)) + '</em></div>';
      }).join('') + '</div>';
  }

  box.innerHTML =
    '<h3>Catatan baru</h3>' +
    '<div class="field"><input type="date" id="gDate" value="' + todayKey() + '"></div>' +
    '<div class="field"><input type="number" id="gCm" placeholder="Tinggi (cm)" step="0.1" min="0" inputmode="decimal">' +
    '<input type="number" id="gKg" placeholder="Berat (kg)" step="0.1" min="0" inputmode="decimal"></div>' +
    '<div class="field"><input type="text" id="gKata" placeholder="Kata/kalimat baru yang muncul…" maxlength="80"></div>' +
    '<div class="field"><input type="text" id="gNote" placeholder="Catatan/momen hari ini…" maxlength="120"></div>' +
    '<button class="btn green sm" id="gAdd">➕ Simpan catatan</button>' +
    (last ? '<div class="kv">' +
      '<div><b>' + (last.cm || '–') + '</b><span>tinggi terakhir (cm)</span></div>' +
      '<div><b>' + (last.kg || '–') + '</b><span>berat terakhir (kg)</span></div>' +
      (gainCm !== null ? '<div><b>+' + gainCm.toFixed(1) + '</b><span>tambah tinggi (cm)</span></div>' : '') +
      '</div>' : '') +
    (chart ? '<h3>Grafik berat badan</h3>' + chart : '') +
    '<h3>Riwayat</h3><div id="gList"></div>';

  const draw = () => {
    const list = $('#gList'); list.innerHTML = '';
    const arr = S.growth().slice().sort((a,b) => (a.d < b.d ? 1 : -1));
    if (!arr.length) { list.innerHTML = '<p class="prog-note">Belum ada catatan.</p>'; return; }
    arr.forEach((x) => {
      const d = document.createElement('div'); d.className = 'rowline';
      const parts = [];
      if (x.cm) parts.push(x.cm + ' cm');
      if (x.kg) parts.push(x.kg + ' kg');
      if (x.kata) parts.push('💬 ' + x.kata);
      if (x.note) parts.push(x.note);
      d.innerHTML = '<span class="em">📏</span><span class="tx">' + esc(x.d) +
        '<div class="sm">' + esc(parts.join(' • ')) + '</div></span>' +
        '<button data-d="' + esc(x.d) + '">Hapus</button>';
      list.appendChild(d);
    });
  };
  draw();
  $('#gList').onclick = (e) => {
    const d = e.target.getAttribute && e.target.getAttribute('data-d');
    if (!d) return;
    if (!confirm('Hapus catatan ' + d + '?')) return;
    LS.set('af_growth', S.growth().filter(x => x.d !== d));
    parentPanel('tumbuh');
  };
  $('#gAdd').onclick = () => {
    const d = $('#gDate').value || todayKey();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast('Tanggal belum benar'); return; }
    if (d > todayKey()) { toast('Tanggal tidak boleh di masa depan'); return; }
    const cmRaw = $('#gCm').value.trim(), kgRaw = $('#gKg').value.trim();
    const cmN = cmRaw === '' ? null : parseFloat(cmRaw);
    const kgN = kgRaw === '' ? null : parseFloat(kgRaw);
    if (cmN !== null && (!isFinite(cmN) || cmN <= 0 || cmN > 200)) { toast('Tinggi harus angka lebih dari 0 (cm)'); return; }
    if (kgN !== null && (!isFinite(kgN) || kgN <= 0 || kgN > 100)) { toast('Berat harus angka lebih dari 0 (kg)'); return; }
    const kata = $('#gKata').value.trim().slice(0,80);
    const note = $('#gNote').value.trim().slice(0,120);
    if (cmN === null && kgN === null && !kata && !note) { toast('Isi minimal satu kolom'); return; }
    const existing = S.growth().find(x => x.d === d);
    if (existing && !confirm('Sudah ada catatan tanggal ' + d + '. Ganti catatan itu?')) return;
    const arr = S.growth().filter(x => x.d !== d);
    arr.push({ d: d, cm: cmN, kg: kgN, kata: kata, note: note });
    S.saveGrowth(arr);
    toast('Catatan disimpan');
    parentPanel('tumbuh');
  };
}

/* ---------- cadangan / pulihkan ---------- */
const BACKUP_KEYS = ['af_name','af_routines','af_rewards','af_target','af_stars','af_today','af_history','af_growth','af_set','af_progress','af_kuis','af_lastReward','af_hij_mode'];
function collectBackup(){
  const out = { _app:'kebun-belajar-alfatih', _v: 1, _at: new Date().toISOString(), data:{} };
  BACKUP_KEYS.forEach(k => { const v = LS.get(k, null); if (v !== null) out.data[k] = v; });
  return out;
}
function validateBackup(obj){
  if (!obj || typeof obj !== 'object' || typeof obj.data !== 'object' || obj.data === null) return 'Format berkas tidak dikenali.';
  const d = obj.data;
  if (d.af_name !== undefined && typeof d.af_name !== 'string') return 'Nama tidak valid.';
  if (d.af_stars !== undefined && !(isFinite(Number(d.af_stars)) && Number(d.af_stars) >= 0)) return 'Jumlah bintang tidak valid.';
  if (d.af_target !== undefined && !(isFinite(Number(d.af_target)) && Number(d.af_target) >= 1)) return 'Target bintang tidak valid.';
  if (d.af_routines !== undefined && !Array.isArray(d.af_routines)) return 'Daftar kegiatan tidak valid.';
  if (d.af_rewards !== undefined && !Array.isArray(d.af_rewards)) return 'Daftar hadiah tidak valid.';
  if (d.af_growth !== undefined && !Array.isArray(d.af_growth)) return 'Data tumbuh kembang tidak valid.';
  if (d.af_progress !== undefined && (typeof d.af_progress !== 'object' || d.af_progress === null)) return 'Data progres tidak valid.';
  return null;
}
function doExport(){
  try {
    const data = collectBackup();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'kebun-belajar-alfatih-' + todayKey() + '.json';
    document.body.appendChild(a); a.click();
    later(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast('Cadangan diunduh');
  } catch (e) { toast('Gagal membuat cadangan'); }
}
function doImport(){
  const inp = $('#pImportFile');
  if (!inp || !inp.files || !inp.files[0]) { toast('Pilih file cadangan dulu'); return; }
  const f = inp.files[0];
  const rd = new FileReader();
  rd.onload = () => {
    let obj;
    try { obj = JSON.parse(String(rd.result)); } catch (e) { toast('File bukan JSON yang benar'); return; }
    const err = validateBackup(obj);
    if (err) { toast(err); return; }
    if (!confirm('Ganti data aplikasi sekarang dengan isi file ini? Data saat ini akan tertimpa.')) return;
    BACKUP_KEYS.forEach(k => { if (Object.prototype.hasOwnProperty.call(obj.data, k)) LS.set(k, obj.data[k]); });
    toast('Data dipulihkan');
    parentPanel('data');
  };
  rd.onerror = () => toast('Gagal membaca file');
  rd.readAsText(f);
}

/* ================= PENGINGAT ISTIRAHAT ================= */
let SESSION_START = Date.now();
let BREAK_SHOWN = false;
function breakWatch(){
  const mins = Number(S.set().breakMin) || 0;
  if (mins <= 0 || BREAK_SHOWN) return;
  if (Date.now() - SESSION_START >= mins * 60000) {
    BREAK_SHOWN = true;
    stopAudio();
    toast('Sudah ' + mins + ' menit. Istirahat dulu yuk 🌿');
    openModal('<h2>Waktunya istirahat 🌿</h2>' +
      '<p class="hint">Anak sudah bermain sekitar ' + mins + ' menit. Sesi pendek lebih baik untuk mata dan perhatian.</p>' +
      '<button class="btn green sm" onclick="window.appClosePanel()">Baik, istirahat</button>' +
      '<button class="btn ghost sm" onclick="window.appBreakSnooze()">Lanjut sebentar lagi</button>');
  }
}
window.appBreakSnooze = () => { BREAK_SHOWN = false; SESSION_START = Date.now(); closeModal(); };
setInterval(breakWatch, 30000);

/* ---------- start ---------- */
document.addEventListener('click', () => { const c = ac(); if (c && c.state === 'suspended') c.resume(); }, { once:true });
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
window.__errs = window.__errs || [];
window.addEventListener('error', (e) => { window.__errs.push(String(e.message || e)); });
window.addEventListener('unhandledrejection', (e) => { window.__errs.push(String((e.reason && e.reason.message) || e.reason)); });
render('home', true);
/* tanda siap untuk pengujian otomatis */
window.__APP_READY = true;
